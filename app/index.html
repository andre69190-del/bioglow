/* Vorlese-Funktion (Web Speech API) – hilft bei Leseschwäche, jüngeren Kindern, anderen Sprachen. */
function speak(t){try{if('speechSynthesis' in window){window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t));u.lang=(S.lang==='en')?'en-US':'de-DE';u.rate=.98;window.speechSynthesis.speak(u);}else toast('Vorlesen wird von diesem Browser nicht unterstützt.');}catch(e){}}
/* Dynamischer Tipp des Tages (motiviert statt leerem Zustand). */
const TIPS=[
  {e:'🦎',t:'Nach Regen: Halte Ausschau nach Feuersalamandern und Schnecken!'},
  {e:'🦋',t:'Sonniger Tag: Schmetterlinge und Wildbienen sind jetzt aktiv.'},
  {e:'🐦',t:'Morgens singen Vögel am lautesten – nimm eine Vogelstimme auf!'},
  {e:'🐸',t:'Am Teich: Entdecke Frösche, Kröten und Libellen.'},
  {e:'🐝',t:'Blühende Wiese? Zähle die Bestäuber – jeder Fund hilft!'},
  {e:'💡',t:'Abends: Miss die Lichtverschmutzung mit dem Licht-Sensor.'},
  {e:'🌵',t:'Hitze? Suche Pflanzen, die Trockenheit gut vertragen.'},
  {e:'📈',t:'Lege einen Monitoring-Punkt an und vergleiche ihn in 2 Wochen.'}
];
function tipOfDay(){return TIPS[Math.floor(Date.now()/864e5)%TIPS.length];}
/* Smarter Tipp: nutzt echtes Wetter (Open-Meteo), Tageszeit & Jahreszeit beim Öffnen. */
async function computeSmartTip(){
  let tip=null;
  try{
    const h=new Date().getHours(),mo=new Date().getMonth()+1;
    let env=null;
    if(online()&&S.useGps){try{const p=await getPosition();env=await fetchEnv(p.lat,p.lng);}catch(e){}}
    if(env&&(env.rain>0.2||(env.soil!=null&&env.soil>0.4)))tip={e:'🦎',t:'Es ist feucht/hat geregnet! Halte Ausschau nach Feuersalamandern, Schnecken und Amphibien.'};
    else if(h<10)tip={e:'🐦',t:'Guten Morgen! Vögel singen jetzt am lautesten – nimm eine Vogelstimme auf.'};
    else if(h>=20)tip={e:'💡',t:'Es wird dunkel: Miss jetzt die Lichtverschmutzung mit dem Licht-Sensor.'};
    else if(env&&env.temp!=null&&env.temp>=26&&(env.soil==null||env.soil<0.18))tip={e:'🌵',t:'Warm & trocken ('+Math.round(env.temp)+' °C): Suche hitze-tolerante Pflanzen und beschatte neue Pflanzungen.'};
    else if(env&&env.temp!=null&&env.temp>=18)tip={e:'🦋',t:'Mild ('+Math.round(env.temp)+' °C): Schmetterlinge, Wildbienen und Bestäuber sind jetzt aktiv.'};
    else if([3,4,5].indexOf(mo)>=0)tip={e:'🌼',t:'Frühling: erste Blüten, Krokusse und Bestäuber – perfekt für einen Scan!'};
    else if([6,7,8].indexOf(mo)>=0)tip={e:'🦋',t:'Sommer: Schmetterlinge, Libellen und blühende Wiesen – jetzt ist Hochsaison für Funde.'};
    else if([9,10].indexOf(mo)>=0)tip={e:'🍄',t:'Herbst: Pilze, Beeren und Zugvögel – und bunte Blätter zum Bestimmen.'};
    else if([11,12,1,2].indexOf(mo)>=0)tip={e:'🐦',t:'Winter: Wintervögel und Spuren im Schnee entdecken – und Monitoring-Fotos machen.'};
  }catch(e){}
  window._smartTip=tip||tipOfDay();
  if(TAB==='home'&&$('modal').classList.contains('hide'))render();
}
function currentTip(){return window._smartTip||tipOfDay();}

async function logMeasurement(type,value,unit){
  let pos=null;try{pos=await getPosition();}catch(e){}
  const rec={id:uid(),source:'measure',mType:type,mValue:value,mUnit:unit||'',speciesDe:type+': '+value+' '+(unit||''),emoji:'📊',
    createdAt:new Date().toISOString(),observedAt:new Date().toISOString(),lat:pos&&pos.lat,lng:pos&&pos.lng,status:'measure',scoreImpact:0,xp:5};
  await IDB.add(rec);OBS.push(rec);if(supaOn())supaSync(rec);

/* Mini-Liniendiagramm für eine Messwert-Zeitreihe (SVG). */
function measSvg(pts){
  if(pts.length<2)return '';
  const W=280,H=54,pad=6,vals=pts.map(p=>p.v),mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rng=(mx-mn)||1,step=(W-pad*2)/(pts.length-1);
  const xy=pts.map((p,i)=>[pad+i*step,H-pad-(p.v-mn)/rng*(H-pad*2)]);
  const line=xy.map(p=>p[0].toFixed(0)+','+p[1].toFixed(0)).join(' ');
  return '<svg width="100%" height="54" viewBox="0 0 '+W+' '+H+'" style="margin-top:6px"><polyline points="'+line+'" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+xy[xy.length-1][0].toFixed(0)+'" cy="'+xy[xy.length-1][1].toFixed(0)+'" r="3.5" fill="#047857"/></svg>';
}

async function senseLight(){
  openModal('<div style="text-align:center"><div class="spinner"></div><div class="mini muted">Kamera misst Helligkeit …</div></div>');
  let stream=null;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=document.createElement('video');v.srcObject=stream;v.muted=true;v.playsInline=true;await v.play();
    await new Promise(r=>setTimeout(r,600));
    const c=document.createElement('canvas');c.width=64;c.height=48;const cx=c.getContext('2d');cx.drawImage(v,0,0,64,48);
    const d=cx.getImageData(0,0,64,48).data;let lum=0;for(let i=0;i<d.length;i+=4)lum+=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
    lum=lum/(d.length/4);const pct=Math.round(lum/255*100);
    stream.getTracks().forEach(t=>t.stop());
    const nite=pct<8?'🌑 sehr dunkel – wenig Lichtverschmutzung, gut für nachtaktive Tiere':pct<25?'🌙 dämmrig':'☀️ hell';
    sensorResult('💡 Licht','<div style="font-size:40px;font-weight:900;color:var(--em);text-align:center">'+pct+' %</div><div class="mini muted" style="text-align:center">Helligkeit (relativ). '+nite+'</div><div class="mini muted" style="margin-top:8px">Nachts gemessen zeigt das die <b>Lichtverschmutzung</b> – sie stört Insekten, Fledermäuse und Vögel.</div><button class="btn btn-ghost btn-sm" style="width:100%;margin-top:12px" onclick="logMeasurement(\'Licht\','+pct+',\'%\')">💾 Wert speichern</button>');
  }catch(e){if(stream)stream.getTracks().forEach(t=>t.stop());sensorResult('💡 Licht','<div class="mini muted">Kamera nicht verfügbar.</div>');}
}
async function senseOrient(){

    if($('orV'))$('orV').innerHTML='<div style="text-align:center"><div style="font-size:34px;font-weight:900;color:var(--em)">'+(h==null?'—':dir)+'</div><div class="mini muted">Kompass '+(h==null?'nicht verfügbar':h+'°')+' · Neigung '+(tilt==null?'—':tilt+'°')+'</div><div class="mini muted" style="margin-top:8px">Die <b>Hangausrichtung</b> (Südhang = warm/trocken) bestimmt mit, welche Arten hier leben.</div></div>';};

async function senseMotion(){
  try{if(typeof DeviceMotionEvent!=='undefined'&&DeviceMotionEvent.requestPermission){const r=await DeviceMotionEvent.requestPermission();if(r!=='granted')return sensorResult('📳 Bewegung','<div class="mini muted">Keine Erlaubnis.</div>');}}catch(e){}

  let peak=0;window._motion=function(e){const a=e.accelerationIncludingGravity||e.acceleration||{};const m=Math.round(Math.sqrt(Math.pow(a.x||0,2)+Math.pow(a.y||0,2)+Math.pow(a.z||0,2)));peak=Math.max(peak,m);

/* 🚦 BIOGLOW-Ampel: App SENDET den Habitat-Score per Bluetooth an einen micro:bit,
   der eine LED grün/orange/rot leuchten lässt. Macht den Namen „GLOW" wörtlich wahr.
   micro:bit-Code (Nordic-UART empfangen „SCORE:67") steht in BIOGLOW_Hardware_Bauanleitung.md. */
async function ampelConnect(){
  if(!('bluetooth' in navigator))return sensorResult('🚦 BIOGLOW-Ampel','<div class="mini muted">Web-Bluetooth wird von diesem Browser nicht unterstützt (Chrome/Edge/Android).</div>');
  try{
    const UART='6e400001-b5a3-f393-e0a9-e50e24dcca9e',RX='6e400002-b5a3-f393-e0a9-e50e24dcca9e';
    const dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'BBC micro:bit'},{namePrefix:'BIOGLOW'}],optionalServices:[UART]});
    const server=await dev.gatt.connect();
    const u=await server.getPrimaryService(UART);window._ampelRx=await u.getCharacteristic(RX);
    await ampelSend(true);
    const v=score(),farbe=v>=67?'grün':v>=45?'orange':'rot';
    sensorResult('🚦 BIOGLOW-Ampel','<div class="mini">✅ Verbunden. Habitat-Score <b>'+v+'</b> gesendet – die Ampel leuchtet jetzt <b>'+farbe+'</b>.</div><div class="mini muted" style="margin-top:6px">Grün ab 67 · Orange ab 45 · sonst Rot.</div><button class="btn btn-ghost btn-sm" style="width:100%;margin-top:12px" onclick="ampelSend()">🔄 Aktuellen Score erneut senden</button>');
  }catch(e){sensorResult('🚦 BIOGLOW-Ampel','<div class="mini muted">'+esc(e.message||'Abgebrochen')+'</div>');}
}
async function ampelSend(silent){
  try{if(!window._ampelRx)return toast('Ampel nicht verbunden.');
    const v=score();await window._ampelRx.writeValue(new TextEncoder().encode('SCORE:'+v+'\n'));
    if(!silent)toast('🚦 Score '+v+' an die Ampel gesendet.');

/* Roboter-Sonde: liest die Umwelt-Sonde am LEGO-/micro:bit-Roboter aus.
   Unterstützt (a) Bluetooth Environmental Sensing (Temp 0x2A6E, Feuchte 0x2A6F)
   und (b) Nordic-UART (micro:bit sendet Text wie „SOIL:42"). Werte landen als Messwert
   -> speicherbar -> Klassen-Dashboard. So beeinflusst der Robot euer Forschungsprojekt. */
async function senseRobot(){
  if(!('bluetooth' in navigator))return sensorResult('🤖 Roboter-Sonde','<div class="mini muted">Web-Bluetooth wird von diesem Browser nicht unterstützt (Chrome/Edge/Android).</div>');
  try{
    const UART='6e400001-b5a3-f393-e0a9-e50e24dcca9e',UART_TX='6e400003-b5a3-f393-e0a9-e50e24dcca9e';
    const dev=await navigator.bluetooth.requestDevice({
      filters:[{namePrefix:'BBC micro:bit'},{namePrefix:'BIOGLOW'},{namePrefix:'LEGO'},{services:[0x181A]},{services:[UART]}],
      optionalServices:[0x181A,0x180F,UART]});
    openModal('<h3>🤖 '+esc(dev.name||'Roboter-Sonde')+'</h3><div id="roV" class="mini muted" style="margin:10px 0"><div class="spinner"></div> Verbinde mit der Sonde …</div><button class="btn btn-primary" onclick="openSensors()">‹ Zurück</button><button class="btn btn-ghost" style="margin-top:8px" onclick="closeModal()">Schließen</button>');
    const server=await dev.gatt.connect();
    let temp=null,hum=null,soil=null;
    try{const es=await server.getPrimaryService(0x181A);
      try{const c=await es.getCharacteristic(0x2A6E);temp=(await c.readValue()).getInt16(0,true)/100;}catch(e){}
      try{const c=await es.getCharacteristic(0x2A6F);hum=(await c.readValue()).getUint16(0,true)/100;}catch(e){}
    }catch(e){}
    try{ // micro:bit UART: sendet z. B. „SOIL:42\n"
      const u=await server.getPrimaryService(UART);const tx=await u.getCharacteristic(UART_TX);
      await tx.startNotifications();
      const raw=await new Promise((res)=>{let s='';const t=setTimeout(()=>res(s),4500);
        tx.addEventListener('characteristicvaluechanged',ev=>{s+=new TextDecoder().decode(ev.target.value);if(s.indexOf('\n')>=0){clearTimeout(t);res(s);}});});
      const m=(raw||'').match(/-?\d+(\.\d+)?/);if(m)soil=parseFloat(m[0]);
    }catch(e){}
    const readings=[];
    if(temp!=null)readings.push(['Temperatur (Roboter)',Math.round(temp*10)/10,'°C','🌡️']);
    if(hum!=null)readings.push(['Luftfeuchte (Roboter)',Math.round(hum),'%','💧']);
    if(soil!=null)readings.push(['Bodenfeuchte (Roboter)',Math.round(soil),'%','🌱']);
    if(!$('roV'))return;
    if(!readings.length){$('roV').innerHTML='<b>Verbunden</b>, aber keine bekannten Messwerte gelesen.<div class="mini muted" style="margin-top:6px">Sende vom micro:bit Text wie „SOIL:42" über Nordic-UART, oder nutze den Environmental-Sensing-Dienst. Anleitung: <b>BIOGLOW_Hardware_Bauanleitung.md</b>.</div>';return;}
    window._robotReadings=readings;
    $('roV').innerHTML='<b>✅ Sonde verbunden.</b>'+readings.map(r=>'<div class="mini" style="margin-top:6px">'+r[3]+' '+esc(r[0])+': <b>'+r[1]+' '+r[2]+'</b></div>').join('')
      +'<button class="btn btn-primary btn-sm" style="width:100%;margin-top:12px" onclick="saveRobotReadings()">💾 Messwerte speichern (→ Dashboard)</button>';
  }catch(e){sensorResult('🤖 Roboter-Sonde','<div class="mini muted">'+esc(e.message||'Abgebrochen')+'</div>');}
}
async function saveRobotReadings(){
  const rs=window._robotReadings||[];if(!rs.length)return;
  for(const r of rs)await logMeasurement(r[0],r[1],r[2]);
  toast('🤖 '+rs.length+' Roboter-Messwert(e) gespeichert.');closeModal();
}

/* ============================ HANDY-SENSOR: LÄRMMESSUNG (Mikrofon) ============================ */
/* Das Handy IST ein Sensor: Mikrofon → grober Schallpegel. Lärm ist ein echter
   Stressfaktor für Wildtiere. Wert ist relativ/geschätzt (Web-Mikros sind nicht kalibriert). */
async function measureNoise(){
  openModal('<div style="text-align:center"><div class="q-emoji">🎙️</div><h3>Lärm messen (Handy-Sensor)</h3><div class="mini muted" style="margin:6px 0 12px">Ich höre 5 Sekunden zu und schätze die Lautstärke. Wert ist relativ (Handy-Mikrofone sind nicht geeicht).</div><div id="nzVal" style="font-size:44px;font-weight:900;color:var(--em)">…</div><div class="mini muted" id="nzMsg" style="margin-top:6px">Messung läuft …</div><button class="btn btn-ghost" style="margin-top:14px" onclick="closeModal()">Schließen</button></div>');
  let stream=null,ctx=null;
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:true});
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    const src=ctx.createMediaStreamSource(stream),an=ctx.createAnalyser();an.fftSize=2048;src.connect(an);
    const buf=new Float32Array(an.fftSize);let sum=0,n=0,peak=0;const t0=Date.now();
    const tick=()=>{
      an.getFloatTimeDomainData(buf);
      let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];
      const db=Math.max(0,Math.round(20*Math.log10(Math.sqrt(s/buf.length)+1e-8)+94));
      sum+=db;n++;peak=Math.max(peak,db);const avg=Math.round(sum/n);
      if($('nzVal'))$('nzVal').textContent=avg+' dB';
      if(Date.now()-t0<5000)requestAnimationFrame(tick);
      else{if(stream)stream.getTracks().forEach(t=>t.stop());if(ctx)ctx.close();
        const lvl=avg<45?'🟢 leise – gut für scheue Tiere':avg<65?'🟡 mäßig':'🔴 laut – Lärm stört Wildtiere';
        if($('nzMsg'))$('nzMsg').innerHTML='Ø '+avg+' dB · Spitze '+peak+' dB<br>'+lvl+'<br><button class="btn btn-ghost btn-sm" style="width:100%;margin-top:10px" onclick="logMeasurement(\'Lärm\','+avg+',\'dB\')">💾 Wert speichern</button>';}
    };
    tick();
  }catch(e){if(stream)stream.getTracks().forEach(t=>t.stop());if($('nzMsg'))$('nzMsg').textContent='Mikrofon nicht verfügbar (Erlaubnis?).';}
}

const _wordRe={};
function tr(s){
  if(s==null||S.lang!=='en')return s;
  if(!_langKeys)_langKeys=Object.keys(DE2EN).sort((a,b)=>b.length-a.length);
  let out=String(s);
  for(const k of _langKeys){
    if(out.indexOf(k)<0)continue;
    if(/^[A-Za-zÄÖÜäöüß]+$/.test(k)){
      // Einzelwort → nur an Wortgrenzen ersetzen (kein Teilwort-Treffer wie „Insekten").
      let re=_wordRe[k];if(!re){re=_wordRe[k]=new RegExp('(^|[^A-Za-zÄÖÜäöüß])'+k+'(?![A-Za-zÄÖÜäöüß])','g');}
      out=out.replace(re,(m,p1)=>p1+DE2EN[k]);
    }else{
      out=out.split(k).join(DE2EN[k]);
    }
  }
  return out;
}

async function restoreBackup(ev){

  try{const j=JSON.parse(await f.text());
    if(j.settings){S=Object.assign(defSettings(),j.settings);saveSettings();}
    if(Array.isArray(j.observations)){for(const o of j.observations)await IDB.add(o);OBS=await IDB.all();}
    applyAppearance();updateModeBtn();updateNet();render();toast('Backup wiederhergestellt.');
  }catch(e){toast('Backup konnte nicht gelesen werden.');}
}

/* Sendet sofort oder legt in die Warteschlange (für Feedback UND Onboarding-Statistik). */
async function postOrQueueFeedback(p){
  if(!online()){queueFeedback(p);return;}
  const ok=await postFeedback(p);
  if(!ok)queueFeedback(p);
}
async function flushFeedbackQueue(){
  if(!online())return;let q=[];try{q=JSON.parse(localStorage.getItem('bioglow_feedback_queue')||'[]');}catch(e){}
  if(!q.length)return;const left=[];
  for(const p of q){const ok=await postFeedback(p);if(!ok)left.push(p);}
  try{localStorage.setItem('bioglow_feedback_queue',JSON.stringify(left));}catch(e){}
}

function startMonitor(){
  const ids=[...new Set(OBS.filter(o=>o.source==='monitor').map(o=>o.spotId))];
  const spots=ids.map(id=>OBS.find(o=>o.spotId===id));
  openModal('<h3>📈 Monitoring-Punkt</h3><div class="mini muted" style="margin:4px 0 10px">Fotografiere immer dieselbe Stelle. So siehst du Veränderungen über die Zeit – vor/nach Schnee, Starkregen oder Jahreszeiten.</div>'

    +'<label class="fld">Neuer Punkt – Name</label><input type="text" id="spotName" placeholder="z. B. Teichufer Nord">'
    +'<button class="btn btn-primary" style="margin-top:10px" onclick="monitorNew()">📷 Foto aufnehmen</button>'
    +'<button class="btn btn-ghost" style="margin-top:8px" onclick="closeModal()">Abbrechen</button>');
}

  if(!ids.length)return startMonitor();
  openModal('<h3>📈 Monitoring</h3><div class="mini muted" style="margin:4px 0 10px">Deine beobachteten Stellen im Zeitverlauf.</div>'
    +ids.map(id=>{const shots=OBS.filter(o=>o.spotId===id);const s=shots[0];return '<button class="q-opt" onclick="openMonitorSpot(\''+id+'\')"><span style="font-size:22px">📍</span><span style="flex:1"><b>'+esc(s.spotName)+'</b><div class="mini muted">'+shots.length+' Aufnahme(n)</div></span></button>';}).join('')
    +'<button class="btn btn-primary" style="margin-top:8px" onclick="startMonitor()">＋ Neuer Punkt / Foto</button>');
}
function openMonitorSpot(id){
  const shots=OBS.filter(o=>o.spotId===id).sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
  if(!shots.length)return openMonitor();
  const s=shots[0],diff=(shots[shots.length-1].green||0)-(shots[0].green||0);
  openModal('<h3>📍 '+esc(s.spotName)+'</h3><div class="mini muted" style="margin:4px 0 10px">'+shots.length+' Aufnahme(n) · älteste zuerst.</div>'
    +shots.map(o=>'<div class="row" style="gap:10px;margin-bottom:8px"><img src="'+o.photo+'" style="width:64px;height:64px;border-radius:10px;object-fit:cover"><div><div class="mini"><b>'+new Date(o.createdAt).toLocaleDateString('de-DE')+'</b></div><div class="mini muted">🌱 Grün '+(o.green!=null?o.green+'%':'—')+(o.bright!=null?' · 💡 '+o.bright+'%':'')+(o.env&&o.env.temp!=null?' · 🌡️ '+Math.round(o.env.temp)+'°C':'')+'</div></div></div>').join('')
    +(shots.length>=2?'<div class="mini" style="background:var(--em-tint);border-radius:10px;padding:10px;margin:6px 0">📊 Veränderung Grün-Index: <b>'+(diff>=0?'+':'')+diff+' %</b> von der ersten bis zur letzten Aufnahme.</div>':'')
    +'<button class="btn btn-primary" style="margin-top:6px" onclick="monitorAgain(\''+id+'\')">📷 Neues Foto hier</button>'
    +'<button class="btn btn-ghost" style="margin-top:8px" onclick="closeModal()">Schließen</button>');
}

/* ============================ START ============================ */
/* Service Worker registrieren – nur über http/https (nicht file://), damit die
   App installierbar & offline-relaunchfähig wird. Fehlt sw.js, passiert nichts. */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
window.addEventListener('online',()=>{updateNet();render();syncPending();flushFeedbackQueue();flushSurveyQueue();});
window.addEventListener('offline',()=>{updateNet();render();});
/* BioBlitz-Countdown: alle 20 s neu rendern, wenn aktiv und auf Missionen-Tab. */
setInterval(()=>{if(S.blitz&&TAB==='missions'&&$('modal').classList.contains('hide'))render();},20000);
/* Erst-Start-Onboarding (GeoQuest-Idee „Wer spielt?"): Altersstufe + Modus setzen. */
function maybeOnboard(){
  try{if(localStorage.getItem('bioglow-onboarded'))return;}catch(e){return;}
  openModal('<div style="text-align:center"><div class="q-emoji">🌿</div><h2>Willkommen bei BIOGLOW</h2><div class="mini muted" style="margin:6px 0 14px">Entdecke, was rund um dich lebt – und hilf der Natur.</div></div>'
    +'<label class="fld">Wer bist du? (passt Quiz &amp; Inhalte an)</label><select id="obGrade">'+Object.keys(GRADES).map(g=>'<option value="'+g+'" '+(g===(S.grade||'3')?'selected':'')+'>'+GRADES[g].label+'</option>').join('')+'</select>'
    +'<label class="fld">Wie nutzt du BIOGLOW?</label><div class="row" style="gap:8px;margin-top:4px"><button class="btn btn-ghost" style="flex:1" onclick="finishOnboard(\'explorer\')">🧭 Entdecken</button><button class="btn btn-primary" style="flex:1" onclick="finishOnboard(\'school\')">🎓 Bildung</button></div>'
    +'<label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--s500);cursor:pointer"><input type="checkbox" id="obHide" checked style="width:18px;height:18px"> Diese Einführung nicht mehr automatisch zeigen</label>');
}
function finishOnboard(mode){
  const sel=$('obGrade');if(sel)S.grade=sel.value;S.mode=mode;
  if(S.grade==='1'||S.grade==='2')S.easy=true;
  const hide=$('obHide')?$('obHide').checked:true;
  S.onbHide=hide;saveSettings();
  if(hide){try{localStorage.setItem('bioglow-onboarded','1');}catch(e){}}
  updateModeBtn();closeModal();render();chooseOnboarding();
}
/* Auswahl: kurze (Standard) oder ausführliche Einführung – oder überspringen. */
function chooseOnboarding(){
  openModal('<div style="text-align:center"><div class="q-emoji">🧭</div><h2>Wie möchtest du starten?</h2>'
    +'<div class="mini muted" style="margin:6px 0 14px">Du kannst es später jederzeit ändern (Profil → Hilfe).</div></div>'
    +'<button class="q-opt" onclick="startTour(0,\'short\')"><span style="font-size:22px">🚀</span><span style="flex:1"><b>Schnellstart (empfohlen)</b><div class="mini muted">Die App in wenigen Schritten – ca. 1 Minute.</div></span></button>'
    +'<button class="q-opt" onclick="startTour(0,\'long\')"><span style="font-size:22px">🧭</span><span style="flex:1"><b>Ausführliche Entdeckung</b><div class="mini muted">Jeder Bereich Schritt für Schritt erklärt.</div></span></button>'
    +'<button class="q-opt" onclick="startMission0()"><span style="font-size:22px">🦔</span><span style="flex:1"><b>Mit Igor dem Igel</b><div class="mini muted">Eine kleine Geschichte – ideal für jüngere Kinder.</div></span></button>'
    +'<button class="btn btn-ghost btn-sm" style="width:100%;margin-top:6px" onclick="skipOnboarding()">Überspringen</button>');
}
function skipOnboarding(){S.onbVariant='skip';saveSettings();logOnboarding('skip',null);closeModal();}

(async function init(){
  try{OBS=await IDB.all();}catch(e){OBS=[];}
  applyAppearance();updateNet();applyLang();
  if((location.hash||'').indexOf('#s=')===0){handleStationHash();}
  else{maybeOnboard();}
  if(typeof computeSmartTip==='function'){computeSmartTip().then(()=>{if(TAB==='home')render();}).catch(()=>{});}
  /* Katalog-Fotos im Hintergrund vorladen (verzögert, damit der Start flüssig bleibt). */
  setTimeout(()=>{try{prewarmPhotos();}catch(e){}},2500);
  /* Offline gespeichertes Feedback/Umfragen nachsenden, falls online. */
  setTimeout(()=>{try{flushFeedbackQueue();flushSurveyQueue();}catch(e){}},3500);
})();
</script>
</body>
</html>
