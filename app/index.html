<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#10b981" />
<link rel="manifest" href="manifest.json" />

<link rel="preconnect" href="https://api.inaturalist.org" crossorigin />
<link rel="preconnect" href="https://inaturalist-open-data.s3.amazonaws.com" crossorigin />
<link rel="preconnect" href="https://static.inaturalist.org" crossorigin />
<link rel="preconnect" href="https://upload.wikimedia.org" crossorigin />

<title>BIOGLOW – Erkennen. Verstehen. Handeln.</title>
<style>
:root{
  --em:#10b981;--em-d:#047857;--em-deep:#065f46;--em-soft:#d1fae5;--em-tint:#ecfdf5;
  --s900:#0f172a;--s700:#334155;--s500:#64748b;--s400:#94a3b8;--s200:#e2e8f0;--s100:#f1f5f9;--s50:#f8fafc;
  --vio:#8b5cf6;--vio-s:#ede9fe;--amb:#f59e0b;--rose:#f43f5e;--blue:#3b82f6;--blue-s:#dbeafe;--white:#fff;
  --score:#10b981;--species:#0ea5e9;--shannon:#8b5cf6;--obs:#f59e0b;
  --r:16px;--r-lg:22px;--sh:0 8px 24px rgba(15,23,42,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--s100);color:var(--s700);line-height:1.5;overscroll-behavior:none}
#app{max-width:480px;margin:0 auto;min-height:100%;background:var(--s50);display:flex;flex-direction:column;position:relative}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.hidden{display:none!important}
h1,h2,h3{margin:0;color:var(--s900);line-height:1.2}
img{display:block}
::-webkit-scrollbar{width:0}

/* top bar */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--s100);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:9px}
.brand .b{width:32px;height:32px;border-radius:9px;background:var(--em);display:flex;align-items:center;justify-content:center;font-size:18px}
.brand .n{font-weight:900;color:var(--s900);letter-spacing:.5px;font-size:17px}
.brand .k{font-size:9px;color:var(--s400);font-weight:700;letter-spacing:1px;text-transform:uppercase}
.hd-right{display:flex;align-items:center;gap:8px}
.mode-btn{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:6px 12px;border-radius:999px;border:1px solid var(--em-soft);background:var(--em-tint);color:var(--em-d)}
.mode-btn.school{background:var(--blue-s);color:#1e40af;border-color:#bfdbfe}
.net{width:9px;height:9px;border-radius:50%;background:var(--em)}
.net.off{background:var(--s400)}

/* screens */
main{flex:1;padding:16px 16px 90px;overflow-y:auto}
.screen{animation:fade .25s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--white);border:1px solid var(--s200);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh)}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 12px}
.sec-title h2{font-size:17px}
.sec-title .more{font-size:12px;font-weight:800;color:var(--em-d)}
.muted{color:var(--s500)}
.mini{font-size:11px}
.row{display:flex;align-items:center;gap:10px}

/* score ring */
.score-head{display:flex;align-items:center;justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px}
.chip-em{background:var(--em-soft);color:var(--em-deep)}
.chip-vio{background:var(--vio-s);color:#6d28d9}
.chip-amb{background:#fef3c7;color:#92400e}
.chip-rose{background:#ffe4e6;color:#9f1239}
.chip-blue{background:var(--blue-s);color:#1e40af}
.ring-wrap{display:flex;justify-content:center;margin:10px 0 4px}
.ring{position:relative;width:170px;height:170px}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num{font-size:52px;font-weight:900;line-height:1;color:var(--em)}
.ring .unit{font-size:11px;color:var(--s500);margin-top:2px}
.stat-row{display:flex;gap:8px;margin-top:14px}
.stat{flex:1;background:var(--white);border:1px solid var(--s200);border-radius:var(--r);padding:12px 6px;text-align:center}
.stat .v{font-size:19px;font-weight:900;color:var(--s900)}
.stat .l{font-size:10px;color:var(--s500)}

/* observation list */
.obs{display:flex;align-items:center;gap:11px;padding:10px;background:var(--s50);border:1px solid var(--s100);border-radius:14px;margin-bottom:8px}
.obs img,.obs .ph{width:46px;height:46px;border-radius:11px;object-fit:cover;background:var(--s100);display:flex;align-items:center;justify-content:center;font-size:22px}
.obs .t{font-weight:800;color:var(--s900);font-size:13px}
.obs .s{font-size:10px;color:var(--s500)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font-weight:800;border-radius:var(--r);padding:14px;font-size:15px;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--em-d);color:#fff;box-shadow:0 6px 18px rgba(16,185,129,.28)}
.btn-ghost{background:var(--white);border:1px solid var(--s200);color:var(--s700)}
.btn-dark{background:var(--s900);color:#fff}
.btn-sm{padding:9px 12px;font-size:13px;border-radius:12px;width:auto}

/* banner */
.banner{display:flex;align-items:center;gap:12px;border-radius:var(--r-lg);padding:16px;color:#fff}
.banner.em{background:var(--em-deep)}
.banner .ic{width:38px;height:38px;border-radius:999px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:19px}

/* bottom nav */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--s200);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 10px;border-radius:12px;color:var(--s400);font-size:10px;font-weight:700}
.tab.on{color:var(--em-d);background:var(--em-tint)}
.tab .i{font-size:20px}

/* camera */
#cam{position:fixed;inset:0;z-index:60;background:#0a0f1e;display:flex;flex-direction:column}
#cam .top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;color:#fff}
#cam .view{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#cam video,#cam img{max-width:100%;max-height:100%;object-fit:contain}
#cam .corners i{position:absolute;width:26px;height:26px;border:3px solid var(--em)}
#cam .controls{display:flex;align-items:center;justify-content:center;gap:26px;padding:22px}
.shutter{width:66px;height:66px;border-radius:50%;background:var(--em);border:4px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:26px}
.cbtn{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}

/* toast */
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:80;max-width:440px;width:92%;background:var(--s900);color:#fff;border-radius:16px;padding:13px 16px;display:flex;gap:10px;align-items:center;box-shadow:var(--sh);font-size:13px;font-weight:600}
#toast.hide{display:none}

/* modal */
#modal{position:fixed;inset:0;z-index:70;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:16px}
#modal.hide{display:none}
.sheet{background:var(--white);width:100%;max-width:440px;border-radius:20px;padding:20px 18px;max-height:86vh;overflow-y:auto;animation:up .28s ease both;box-shadow:0 20px 60px rgba(15,23,42,.35)}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--s200);margin:0 auto 14px}

/* forms */
label.fld{display:block;font-size:12px;font-weight:800;color:var(--s500);margin:12px 0 5px}
select,input[type=text],input[type=password]{width:100%;padding:12px;border:1px solid var(--s200);border-radius:12px;font-size:14px;font-family:inherit;background:var(--white);color:var(--s900)}
select:focus,input:focus{outline:2px solid var(--em);border-color:transparent}

/* quiz */
.q-opt{width:100%;text-align:left;padding:14px;border:1.5px solid var(--s200);border-radius:14px;background:var(--white);font-weight:700;color:var(--s700);margin-bottom:9px;display:flex;align-items:center;gap:10px;font-size:14px;transition:.12s}
.q-opt:active{transform:scale(.99)}
.q-opt.correct{border-color:var(--em);background:var(--em-tint);color:var(--em-deep)}
.q-opt.wrong{border-color:var(--rose);background:#fff1f2;color:#9f1239}
.q-emoji{font-size:60px;text-align:center;margin:6px 0}

/* badges */
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;padding:12px 6px;border-radius:14px;border:1px solid var(--s200);background:var(--s50)}
.badge.on{border-color:var(--em-soft);background:var(--em-tint)}
.badge.off{opacity:.4}
.badge .e{font-size:26px}
.badge .l{font-size:9px;font-weight:800;color:var(--s600,#475569);margin-top:4px;line-height:1.1}

.pill-list{display:flex;flex-wrap:wrap;gap:7px}
.pill{font-size:11px;font-weight:800;padding:5px 11px;border-radius:999px;background:var(--s100);color:var(--s600,#475569)}
.spinner{width:34px;height:34px;border:4px solid var(--s200);border-top-color:var(--em);border-radius:50%;animation:spin .8s linear infinite;margin:16px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.check-line{display:flex;gap:8px;align-items:flex-start;font-size:12px;margin:5px 0}
.check-line .ci{flex:none;margin-top:1px}
/* Große Schrift (Barrierefreiheit) */
#app.bigtext{font-size:114%}
/* Dark Mode: Kern-Tokens + fest verdrahtete Flächen überschreiben */
#app.dark{--s50:#0b1220;--s100:#111a2b;--s200:#243247;--white:#16233b;--surface:#16233b;--s900:#f1f5f9;--s700:#e2e8f0;--s600:#cbd5e1;--s500:#94a3b8;--s400:#7c8aa3;--em-tint:#0b3b2e;--em-soft:#0e5140;--vio-s:#3b2a63;--blue-s:#173049;background:#0b1220;color:#e2e8f0}
#app.dark header,#app.dark nav{background:rgba(17,26,43,.94);border-color:#243247}
#app.dark .obs,#app.dark .stat,#app.dark .q-opt,#app.dark select,#app.dark input[type=text],#app.dark input[type=password]{background:#16233b;color:#e2e8f0;border-color:#243247}
#app.dark .tab.on{background:#0e5140}
/* Farbenblind-Modus: kontraststarke, deuteranopie-sichere Palette (Blau/Orange statt Grün/Rot) */
#app.cb{--em:#0072B2;--em-d:#005a8d;--em-deep:#004b76;--blue:#56B4E9;--amb:#E69F00;--rose:#D55E00;--score:#0072B2;--species:#56B4E9;--shannon:#CC79A7;--obs:#E69F00}
#app.cb .chip-em{background:#cfe6f5;color:#004b76}
#app.cb .chip-amb{background:#f7e2c0;color:#7a4b00}
#app.cb .chip-blue{background:#dceefb;color:#004b76}

<div id="app">
  <header>

    </div>
    <div class="hd-right">
      <span class="net" id="netDot" title="online"></span>
      <button class="mode-btn" id="modeBtn" onclick="openModePick()"><span id="modeIco">🧭</span> <span id="modeTxt">Entdecken</span> ▾</button>
    </div>
  </header>

  <main id="main"><!-- screens injected --></main>

  <nav>
    <button class="tab on" data-tab="home" onclick="go('home')"><span class="i">🏠</span>Start</button>
    <button class="tab" data-tab="scan" onclick="go('scan')"><span class="i">📷</span>Scannen</button>
    <button class="tab" data-tab="missions" onclick="go('missions')"><span class="i">🎯</span>Missionen</button>
    <button class="tab" data-tab="learn" onclick="go('learn')"><span class="i">🧠</span>Lernen</button>
    <button class="tab" data-tab="profile" onclick="go('profile')"><span class="i">👤</span>Profil</button>
  </nav>
</div>

<div id="toast" class="hide"><span>✨</span><span id="toastMsg"></span></div>
<div id="modal" class="hide" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div id="cam" class="hidden"></div>

const IDB = (()=>{
  let dbp;
  function open(){
    if(dbp)return dbp;
    dbp=new Promise((res,rej)=>{
      const r=indexedDB.open('bioglow',1);
      r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('obs'))db.createObjectStore('obs',{keyPath:'id'});};
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
    });
    return dbp;
  }
  function tx(mode){return open().then(db=>db.transaction('obs',mode).objectStore('obs'));}
  return {
    add:o=>tx('readwrite').then(s=>new Promise((res,rej)=>{const r=s.put(o);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);})),
    all:()=>tx('readonly').then(s=>new Promise((res,rej)=>{const r=s.getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);})),
    clear:()=>tx('readwrite').then(s=>new Promise((res)=>{s.clear().onsuccess=()=>res();}))
  };
})();

function validated(){return OBS.filter(o=>o.status==='validated');}

/* Datenqualität wie bei iNaturalist: Forschungsqualität (peer-bestätigt) · Bestätigt · Braucht Bestimmung.
   „research" braucht: Foto + Standort + mind. 1 unabhängige Bestätigung. */
function qualityTier(o){
  if(!o)return 'casual';
  const solid=o.photo&&o.lat!=null&&o.status==='validated';
  if(solid&&(o.confirms||0)>=1)return 'research';
  if(o.status==='validated')return 'validated';
  return 'needsid';
}
function qualBadge(o){const t=qualityTier(o);
  return t==='research'?['⭐ Forschungsqualität','chip-em']:t==='validated'?['Bestätigt','chip-em']:
    t==='needsid'?['Braucht Bestimmung','chip-blue']:['Beiläufig','chip-blue'];}
function researchCount(){return OBS.filter(o=>qualityTier(o)==='research').length;}
function xp(){return OBS.reduce((a,o)=>a+(o.xp||0),0);}
function level(){return Math.floor(xp()/500)+1;}
function levelInto(){return xp()-(level()-1)*500;}
function speciesCount(){return new Set(OBS.filter(o=>o.source==='scan').map(o=>o.speciesKey)).size;}
/* Shannon-Index H = -Σ p·ln(p): misst Artenvielfalt UND Gleichverteilung (echte MINT-Mathematik). */
function shannon(){
  const scans=OBS.filter(o=>o.source==='scan');const c={};
  scans.forEach(o=>c[o.speciesKey]=(c[o.speciesKey]||0)+1);
  const n=scans.length;if(!n)return 0;let h=0;
  for(const k in c){const p=c[k]/n;h-=p*Math.log(p);}
  return h;
}

}

function _weeksBuckets(n){
  const now=new Date();now.setHours(23,59,59,999);const arr=[];
  for(let i=n-1;i>=0;i--){const end=new Date(now);end.setDate(end.getDate()-i*7);const start=new Date(end);start.setDate(start.getDate()-6);start.setHours(0,0,0,0);
    arr.push({start:start.getTime(),end:end.getTime(),label:end.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})});}
  return arr;
}
function _lineSvg(vals,color){
  const W=300,H=76,pad=8,mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rng=(mx-mn)||1,step=(W-pad*2)/((vals.length-1)||1);
  const pts=vals.map((v,i)=>[pad+i*step,H-pad-(v-mn)/rng*(H-pad*2)]);
  const line=pts.map(p=>p[0].toFixed(0)+','+p[1].toFixed(0)).join(' ');
  const last=pts[pts.length-1];
  return '<svg width="100%" height="'+H+'" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><polyline points="'+line+'" fill="none" stroke="'+color+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+last[0].toFixed(0)+'" cy="'+last[1].toFixed(0)+'" r="4" fill="'+color+'"/></svg>';
}
function _barsSvg(vals,color){
  const W=300,H=76,pad=8,n=vals.length||1,mx=Math.max.apply(null,[1].concat(vals)),gap=(W-pad*2)/n,bw=gap*0.68;
  let b='';vals.forEach((v,i)=>{const h=(v/mx)*(H-pad*2);b+='<rect x="'+(pad+i*gap+(gap-bw)/2).toFixed(1)+'" y="'+(H-pad-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1,h).toFixed(1)+'" rx="2" fill="'+color+'"/>';});
  return '<svg width="100%" height="'+H+'" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+b+'</svg>';
}
function _shannonUpTo(scans){const c={};scans.forEach(o=>c[o.speciesKey]=(c[o.speciesKey]||0)+1);let n=0;for(const k in c)n+=c[k];if(!n)return 0;let h=0;for(const k in c){const p=c[k]/n;h-=p*Math.log(p);}return h;}
function _chartCard(title,valueLabel,svg,labels){
  return '<div class="card" style="margin-bottom:12px"><div class="row" style="justify-content:space-between;margin-bottom:4px"><b>'+title+'</b><span class="chip chip-em">'+valueLabel+'</span></div>'+svg
    +'<div style="display:flex;justify-content:space-between;padding:2px 6px">'+labels.map(l=>'<span class="mini muted">'+l+'</span>').join('')+'</div></div>';
}
/* Gemeinsamer Diagramm-Baustein für Analyse UND Biodiversitätsbericht (eine Quelle der Wahrheit). */
function _reportCharts(P){
  const scans=OBS.filter(o=>o.source==='scan');if(!scans.length)return '';
  const wk=_periodBuckets(P),cumSpecies=[],cumScore=[],cumShannon=[],findsWk=[];
  wk.forEach(w=>{const upto=scans.filter(o=>new Date(o.createdAt).getTime()<=w.end);
    cumSpecies.push(new Set(upto.map(o=>o.speciesKey)).size);
    cumScore.push(clamp(Math.round(RULES.base+upto.filter(o=>o.status==='validated').reduce((a,o)=>a+(o.scoreImpact||0),0)),RULES.scoreMin,RULES.scoreMax));
    cumShannon.push(+_shannonUpTo(upto).toFixed(2));
    findsWk.push(scans.filter(o=>{const t=new Date(o.createdAt).getTime();return t>=w.start&&t<=w.end;}).length);});
  const labels=wk.map(w=>w.label);
  return _chartCard(METRICS.habitatScore.label+'-Verlauf',cumScore[cumScore.length-1]+'/100',_lineSvg(cumScore,'var(--score)'),labels)
    +_chartCard('Artenentwicklung (kumulativ)',cumSpecies[cumSpecies.length-1]+' Arten',_lineSvg(cumSpecies,'var(--species)'),labels)
    +_chartCard(METRICS.shannon.label+'-Verlauf',cumShannon[cumShannon.length-1].toFixed(2),_lineSvg(cumShannon,'var(--shannon)'),labels)

}

/* ---------- Plausibilität / Anti-Cheat ---------- */
function checkObs(o){
  const c=[];const add=(lvl,t)=>c.push({lvl,t});
  if(!o.photo)add('error','Kein Beweisfoto – ohne Foto keine Punkte.');else add('ok','Beweisfoto vorhanden.');
  const ageH=(Date.now()-new Date(o.observedAt||o.createdAt).getTime())/3.6e6;
  if(ageH>RULES.photoMaxAgeH)add('warn','Foto älter als '+RULES.photoMaxAgeH+' h.');else add('ok','Aufnahme aktuell.');
  if(o.lat!=null){add('ok','Standort erfasst ('+(o.acc!=null?'±'+o.acc+' m':'GPS')+').');
    if(o.acc&&o.acc>RULES.gpsMaxAcc)add('info','GPS-Genauigkeit ist grob.');}
  else add('info','Kein Standort – Ortsbezug nicht verifizierbar.');
  const sp=SP_BY_KEY[o.speciesKey];
  if(sp){const mth=new Date(o.observedAt||o.createdAt).getMonth()+1;
    if(sp.months&&!sp.months.includes(mth))add('warn',sp.de+' ist im Monat '+mth+' untypisch – bitte prüfen.');else add('ok','Jahreszeitlich plausibel.');
    if(sp.sensitive)add('info','Gefährdete Art – Standort wird öffentlich unscharf gezeigt.');}
  exifChecks(o).forEach(x=>add(x[0],x[1]));
  const err=c.some(x=>x.lvl==='error'),warn=c.some(x=>x.lvl==='warn');
  return {checks:c,status:err?'pending':warn?'flagged':'validated'};
}

/* ---------- Standort ---------- */
let _lastPos=null;
/* Bester Fix: sammelt bis zu ~8 s mehrere Messungen und nimmt die genaueste.
   Ein Handy-GPS wird in den ersten Sekunden deutlich präziser – deshalb warten wir kurz.
   Sehr guter Fix (≤15 m) wird sofort genommen. */
function getPosition(opt){
  const goodEnough=(opt&&opt.goodEnough)||15,maxWait=(opt&&opt.maxWait)||8000;
  return new Promise((res,rej)=>{
    if(!S.useGps)return rej(new Error('Standort in den Einstellungen deaktiviert'));
    if(!navigator.geolocation)return rej(new Error('Kein GPS'));
    let best=null,done=false,wid=null;
    const finish=()=>{
      if(done)return;done=true;
      if(wid!=null){try{navigator.geolocation.clearWatch(wid);}catch(e){}}
      if(best){const o={lat:+best.coords.latitude.toFixed(6),lng:+best.coords.longitude.toFixed(6),acc:Math.round(best.coords.accuracy)};_lastPos={lat:o.lat,lng:o.lng,ts:Date.now()};res(o);}
      else rej(new Error('Kein GPS-Fix'));
    };
    const t=setTimeout(finish,maxWait);
    try{
      wid=navigator.geolocation.watchPosition(
        p=>{if(!best||p.coords.accuracy<best.coords.accuracy)best=p;if(p.coords.accuracy<=goodEnough){clearTimeout(t);finish();}},
        e=>{if(!best){clearTimeout(t);done=true;rej(e);}},
        {enableHighAccuracy:true,timeout:maxWait,maximumAge:0});
    }catch(e){clearTimeout(t);rej(e);}
  });
}
/* Schneller Standort für „was ist hier häufig" – nutzt gecachte Position (5 Min). */
function getPositionCached(){
  if(_lastPos&&Date.now()-_lastPos.ts<300000)return Promise.resolve(_lastPos);
  return new Promise((res,rej)=>{
    if(!S.useGps||!navigator.geolocation)return rej(new Error('kein GPS'));
    navigator.geolocation.getCurrentPosition(
      p=>{_lastPos={lat:+p.coords.latitude.toFixed(5),lng:+p.coords.longitude.toFixed(5),ts:Date.now()};res(_lastPos);},
      ()=>rej(new Error('kein GPS')),{enableHighAccuracy:false,timeout:6000,maximumAge:300000});
  });
}

/* ---------- Bild komprimieren ---------- */
function compress(srcEl,max){max=max||1024;let w=srcEl.videoWidth||srcEl.naturalWidth||srcEl.width,h=srcEl.videoHeight||srcEl.naturalHeight||srcEl.height;
  if(w>max||h>max){if(w>h){h=Math.round(h/w*max);w=max;}else{w=Math.round(w/h*max);h=max;}}
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(srcEl,0,0,w,h);
  return c.toDataURL('image/jpeg',0.72);}
function fileToDataUrl(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>res(compress(img));img.onerror=rej;img.src=e.target.result;};r.onerror=rej;r.readAsDataURL(file);});}

/* ---------- EXIF-Metadaten lesen (Anti-Cheat „Detective-KI") ----------
   Kompression per Canvas entfernt EXIF – deshalb lesen wir die Rohdatei vorher aus.
   Ein echtes Kamerafoto hat i. d. R. Make/Model + oft GPS + Aufnahmedatum.
   Ein Screenshot / heruntergeladenes Bild hat meist KEIN EXIF oder „Software: Photoshop". */
function readExif(file){
  return new Promise((res)=>{
    const r=new FileReader();
    r.onload=()=>{try{res(parseExif(r.result));}catch(e){res({hasExif:false});}};
    r.onerror=()=>res({hasExif:false});
    r.readAsArrayBuffer(file.slice(0,Math.min(file.size,131072)));
  });
}
function parseExif(buf){
  const dv=new DataView(buf),out={hasExif:false,make:'',model:'',software:'',hasGps:false,dateTime:''};
  if(dv.byteLength<4||dv.getUint16(0)!==0xFFD8)return out; // kein JPEG
  let off=2;
  while(off+4<dv.byteLength){
    const marker=dv.getUint16(off);
    if((marker&0xFF00)!==0xFF00)break;
    const size=dv.getUint16(off+2);
    if(marker===0xFFE1){ // APP1 (Exif)
      const start=off+4;
      if(dv.getUint32(start)===0x45786966){ // "Exif"
        const t=start+6; // TIFF-Header
        const le=dv.getUint16(t)===0x4949; // II = little-endian
        const u16=(o)=>dv.getUint16(o,le),u32=(o)=>dv.getUint32(o,le);
        const ifd0=t+u32(t+4),n=u16(ifd0);
        for(let i=0;i<n;i++){
          const e=ifd0+2+i*12,tag=u16(e),typ=u16(e+2),cnt=u32(e+4);
          const readStr=()=>{let p=cnt>4?t+u32(e+8):e+8,s='';for(let k=0;k<cnt-1;k++){const ch=dv.getUint8(p+k);if(!ch)break;s+=String.fromCharCode(ch);}return s.trim();};
          if(tag===0x010F)out.make=readStr();
          else if(tag===0x0110)out.model=readStr();
          else if(tag===0x0131)out.software=readStr();
          else if(tag===0x0132)out.dateTime=readStr();
          else if(tag===0x8825)out.hasGps=true;
        }
        out.hasExif=!!(out.make||out.model||out.dateTime||out.software||out.hasGps);
      }
      return out;
    }
    off+=2+size;
  }
  return out;
}
/* Bewertet die Metadaten eines HOCHGELADENEN Fotos. Kamerafotos (live) sind immer vertrauenswürdig. */
function exifChecks(o){
  const out=[];
  if(o.photoSource==='camera'){out.push(['ok','Live mit der Kamera aufgenommen – vertrauenswürdig.']);return out;}
  if(o.photoSource!=='upload')return out;
  const x=o.exif||{};
  const soft=(x.software||'').toLowerCase();
  if(/photoshop|gimp|snapseed|lightroom|affinity|pixelmator/.test(soft))
    out.push(['warn','Foto wurde mit Bildbearbeitung ('+x.software+') verändert – bitte prüfen.']);
  if(!x.hasExif)
    out.push(['warn','Hochgeladenes Foto ohne Kamera-Metadaten – evtl. Screenshot oder aus dem Internet. Prüfung nötig.']);
  else if(x.make||x.model)
    out.push(['ok','Kamera-Metadaten vorhanden ('+[x.make,x.model].filter(Boolean).join(' ')+').']);
  return out;
}

function seedRand(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0)/2**32;}

/* Demo-Vorschläge aus lokalem Katalog, nach Saison gewichtet */
function demoIdentify(dataUrl){
  const m=new Date().getMonth()+1,seed=seedRand((dataUrl||'x').slice(0,400));
  const scored=SPECIES.map((s,i)=>({s,w:(s.months.includes(m)?1:0.4)*(0.6+seedRand(s.key+seed)*0.8)+i*1e-6})).sort((a,b)=>b.w-a.w);
  const top=scored.slice(0,4),tot=top.reduce((a,x)=>a+x.w,0)||1;
  return top.map((x,i)=>({key:x.s.key,sci:x.s.sci,de:x.s.de,emoji:x.s.emoji,grp:x.s.grp,impact:x.s.impact,fact:x.s.fact,
    conf:clamp((x.w/tot)*(i===0?1.6:1),.3,.97)}));
}
/* Echtes Vorschaubild von Wikipedia holen (damit z. B. Grasfrosch und Erdkröte
   unterschiedlich aussehen und nicht beide nur 🐸 zeigen). Ergebnis wird gecacht.

/* Echtes Foto einer Art holen. Quelle 1: iNaturalist (sehr zuverlässig für Arten),
   Quelle 2 (Rückfall): Wikipedia. URLs werden DAUERHAFT gecacht (localStorage) → beim
   nächsten Mal kein API-Aufruf mehr, das Bild lädt sofort. Offline → Emoji-Rückfall.
   Wir holen bewusst KLEINE Bilder (schneller): iNat "small" (240px) statt "medium". */
let _photoCache={};

async function inatPhoto(sci){

async function speciesPhoto(sci){

/* Beim Start im Hintergrund alle Katalog-Fotos vorladen: erst die URL cachen, dann das
   Bild in den Browser-Cache holen. Danach erscheinen Quiz-/Scan-Bilder praktisch sofort. */
let _prewarmDone=false;
async function prewarmPhotos(){
  if(_prewarmDone||!online()||typeof SPECIES==='undefined')return;_prewarmDone=true;
  const list=SPECIES.filter(s=>s.sci);
  const BATCH=5;                                   // in kleinen Paketen parallel → viel schneller fertig
  for(let i=0;i<list.length;i+=BATCH){
    await Promise.all(list.slice(i,i+BATCH).map(async s=>{
      const u=await speciesPhoto(s.sci);           // URL (aus Cache sofort, sonst 1 API-Aufruf)
      if(u){try{const im=new Image();im.decoding='async';im.src=u;}catch(e){}} // Bild-Bytes vorladen
    }));
    await new Promise(r=>setTimeout(r,120));        // kurze Pause, um die API zu schonen
  }
}

/* iNaturalist echte Artensuche (Autocomplete gegen weltweite Datenbank) */
async function inatSearch(q){
  const url='https://api.inaturalist.org/v1/taxa?q='+encodeURIComponent(q)+'&per_page=8&locale='+(S.lang||'de')+'&all_names=true';
  const r=await fetch(url);if(!r.ok)throw new Error('iNat '+r.status);const j=await r.json();
  return (j.results||[]).filter(t=>t.rank_level<=10).map(t=>({
    key:'inat_'+t.id,inatId:t.id,sci:t.name,de:t.preferred_common_name||t.name,
    emoji:emojiForIconic(t.iconic_taxon_name),grp:germanIconic(t.iconic_taxon_name),
    impact:2,conf:null,photo:t.default_photo&&t.default_photo.square_url,
    fact:(t.wikipedia_summary||'').replace(/<[^>]+>/g,'').slice(0,160)}));
}
function emojiForIconic(n){return {Aves:'🐦',Insecta:'🐝',Amphibia:'🐸',Reptilia:'🦎',Mammalia:'🦔',Plantae:'🌿',Fungi:'🍄',Arachnida:'🕷️',Mollusca:'🐌',Actinopterygii:'🐟'}[n]||'🔎';}
function germanIconic(n){return {Aves:'Vogel',Insecta:'Insekt',Amphibia:'Amphibie',Reptilia:'Reptil',Mammalia:'Säugetier',Plantae:'Pflanze',Fungi:'Pilz'}[n]||'Art';}

/* Pl@ntNet Bildbestimmung (braucht Schlüssel; Best-Effort, CORS abhängig) */
async function plantnetIdentify(dataUrl){
  const key=S.keys.plantnet;if(!key)throw new Error('Kein Pl@ntNet-Schlüssel');
  const blob=await (await fetch(dataUrl)).blob();
  const fd=new FormData();fd.append('images',blob,'photo.jpg');fd.append('organs','auto');
  const r=await fetch('https://my-api.plantnet.org/v2/identify/all?api-key='+encodeURIComponent(key),{method:'POST',body:fd});
  if(!r.ok)throw new Error('Pl@ntNet '+r.status);const j=await r.json();
  return (j.results||[]).slice(0,4).map(x=>({key:'pn_'+(x.species.scientificNameWithoutAuthor||'').replace(/\s/g,'_'),
    sci:x.species.scientificNameWithoutAuthor,de:(x.species.commonNames&&x.species.commonNames[0])||x.species.scientificNameWithoutAuthor,
    emoji:'🌿',grp:'Pflanze',impact:2,conf:x.score,fact:''}));
}

/* ---------- On-Device KI: echte Bilderkennung im Browser (TensorFlow.js + MobileNet) ---------- */
/* Läuft lokal auf dem Gerät. Modell wird beim 1. Mal aus dem CDN geladen (~16 MB) und danach
   vom Browser gecacht → funktioniert anschließend auch offline. Kein Server, keine Daten verlassen das Gerät. */
let _mnet=null,_mnetLoading=null;
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.async=true;s.onload=res;s.onerror=()=>rej(new Error('Skript nicht ladbar'));document.head.appendChild(s);});}
async function ensureMobilenet(){
  if(_mnet)return _mnet;
  if(_mnetLoading)return _mnetLoading;
  _mnetLoading=(async()=>{
    if(!window.tf)await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js');
    if(!window.mobilenet)await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js');
    _mnet=await window.mobilenet.load({version:2,alpha:1.0});
    return _mnet;
  })();
  try{return await _mnetLoading;}catch(e){_mnetLoading=null;throw e;}
}
function dataUrlToImg(u){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u;});}
function guessEmoji(l){l=(l||'').toLowerCase();
  if(/\bbee\b|wasp|hornet/.test(l))return '🐝';
  if(/butterfly|moth|admiral|monarch/.test(l))return '🦋';
  if(/beetle|ladybug|ladybird|mantis|\bant\b|grasshopper|cricket|dragonfly|weevil/.test(l))return '🐞';
  if(/bird|jay|magpie|finch|robin|sparrow|owl|duck|goose|crane|stork|jackdaw|chickadee|titmouse|wren|kite|hawk|woodpecker/.test(l))return '🐦';
  if(/frog|toad|newt|salamander|axolotl/.test(l))return '🐸';
  if(/lizard|snake|gecko|iguana|skink/.test(l))return '🦎';
  if(/spider|tarantula|scorpion|arachnid/.test(l))return '🕷️';
  if(/snail|slug|conch/.test(l))return '🐌';
  if(/mushroom|fungus|agaric|bolete|earthstar|stinkhorn/.test(l))return '🍄';
  if(/daisy|dandelion|flower|orchid|rose|tulip|sunflower|hip|pot,\sflowerpot/.test(l))return '🌸';
  if(/tree|oak|pine|maple|willow|leaf|acorn|cypress|fir\b/.test(l))return '🌳';
  if(/fox|hedgehog|squirrel|mouse|rabbit|hare|deer|bat\b|mole|shrew|vole|marmot/.test(l))return '🦔';
  return '🔎';
}
/* --- Plausibilitäts-Filter: verhindert, dass Menschen/Gegenstände als Art durchgehen ---
   MobileNet (ImageNet) kennt KEINE Klasse "Mensch". Ein Foto von einer Person wird deshalb
   zwangsweise auf die optisch ähnlichste der 1000 Klassen geworfen (oft Kleidung, Perücke,
   Möbel …). Ohne Filter würde daraus ein falscher "Fund". Diese zwei Listen fangen das ab. */
const NONNATURE_RE=/\b(wig|mask|ski_?mask|bathing_?cap|shower_?cap|bonnet|sunglass|sunglasses|suit|jersey|sweatshirt|cardigan|jean|jeans|miniskirt|maillot|bikini|brassiere|bra|bow_?tie|bolo_?tie|lab_?coat|trench_?coat|kimono|poncho|gown|swab|neck_?brace|stethoscope|face_?powder|hair_?spray|lotion|sunscreen|band_?aid|cowboy_?hat|sombrero|football_?helmet|crash_?helmet|seat_?belt|car|truck|minivan|pickup|sports_?car|racer|screen|monitor|laptop|notebook|desktop_?computer|cellular|cellphone|telephone|ipod|remote|desk|dining_?table|table_?lamp|wardrobe|refrigerator|washer|microwave|toilet|sink|chair|couch|throne|book|binder|envelope|street_?sign|traffic_?light|wall_?clock|pillow|quilt|hand_?blower|mailbox|barber_?chair|shoe|running_?shoe|clog|sandal|maraca|balloon)\b/;
const NATURE_RE=/(bee|wasp|hornet|butterfl|moth|beetle|ladyb|mantis|\bant\b|grasshopper|cricket|dragonfly|weevil|leafhopper|bird|jay|magpie|finch|robin|sparrow|owl|duck|goose|crane|stork|jackdaw|chickadee|titmouse|wren|kite|hawk|woodpecker|frog|toad|newt|salamander|lizard|snake|gecko|iguana|skink|spider|scorpion|snail|slug|mushroom|fungus|agaric|bolete|earthstar|stinkhorn|daisy|dandelion|flower|orchid|rose|tulip|sunflower|\bhip\b|tree|oak|pine|maple|willow|leaf|acorn|cypress|\bfir\b|fox|hedgehog|squirrel|mouse|rabbit|hare|deer|\bbat\b|mole|shrew|vole|marmot|coral|caterpillar|worm|centipede|millipede|\bmoss\b|fern|fruit|berry|corn)/;
/* Optional stärkere Sperre: Browser-eigene Gesichtserkennung (kein Download). Wenn nicht
   verfügbar (z. B. Desktop ohne Flag), greift weiterhin der Wort-Filter oben. */
async function containsFace(img){
  try{
    if('FaceDetector' in window){
      const fd=new window.FaceDetector({fastMode:true,maxDetectedFaces:1});
      const faces=await fd.detect(img);
      return !!(faces&&faces.length);
    }
  }catch(e){/* Detector nicht nutzbar → kein harter Block, Wort-Filter reicht */}
  return false;
}
/* Versucht, ein englisches MobileNet-Label auf den lokalen Katalog abzubilden (grobe Stichwort-Suche). */
function matchCatalog(label){
  const l=(label||'').toLowerCase();
  for(const s of SPECIES){
    const keys=[s.sci,s.de,s.grp].join(' ').toLowerCase();
    const sciGenus=(s.sci||'').split(' ')[0].toLowerCase();
    if(sciGenus&&l.includes(sciGenus))return s;
    if(s.en&&l.includes(String(s.en).toLowerCase()))return s;
    if(keys&&l&&keys.split(/\s+/).some(w=>w.length>4&&l.includes(w)))return s;
  }
  return null;
}
async function ondeviceIdentify(dataUrl){
  const net=await ensureMobilenet();
  const img=await dataUrlToImg(dataUrl);
  /* 1) Harte Sperre: erkennt der Browser ein Gesicht, ist es (fast) sicher ein Mensch. */
  if(await containsFace(img)){
    return [{reject:true,reason:'face',de:'Das sieht nach einem Menschen aus 🙂',
      hint:'BIOGLOW bestimmt Pflanzen, Tiere und Pilze – bitte fotografiere ein Lebewesen (Blatt, Blüte, Insekt …).'}];
  }
  const preds=await net.classify(img,5);
  const mapped=(preds||[]).map((p)=>{
    const label=(p.className||'').split(',')[0].trim();
    const rawKey=(p.className||'').toLowerCase().replace(/[ ,]/g,'_');
    const m=matchCatalog(label);
    if(m)return {key:m.key,sci:m.sci,de:m.de,emoji:m.emoji,grp:m.grp,impact:m.impact,fact:m.fact,conf:p.probability,_label:rawKey,_matched:true};
    return {key:'mn_'+label.replace(/\s+/g,'_'),sci:label,de:label,emoji:guessEmoji(label),grp:'Art (On-Device KI)',impact:2,
      fact:'Von der Offline-KI (MobileNet) im Browser erkannt. Bitte selbst prüfen und ggf. Namen anpassen.',conf:p.probability,_label:rawKey,_matched:false};
  });
  /* 2) Wort-Filter: Kleidung/Möbel/Technik raus; Nicht-Katalog-Labels nur behalten, wenn sie
        klar nach Natur aussehen UND genug Konfidenz haben. Katalog-Treffer sind vertrauenswürdiger. */
  const filtered=mapped.filter((c)=>{
    const l=c._label||'';
    if(NONNATURE_RE.test(l))return false;
    if(c._matched)return c.conf>=0.04;
    return NATURE_RE.test(l)&&c.conf>=0.12;
  });
  /* 3) Nichts Plausibles übrig → ehrliche Rückmeldung statt erfundener Art. */
  if(!filtered.length){
    return [{reject:true,reason:'nonnature',de:'Kein Lebewesen sicher erkannt',
      hint:'Bitte näher an Blatt, Blüte oder Tier herangehen, scharf stellen und erneut versuchen – oder online iNaturalist/Pl@ntNet wählen.'}];
  }
  return await attachWikiThumbs(filtered);
}

/* ===== KI-Infrastruktur 1.0 (additiv – wickelt bestehende Provider ein) ===== */
function _now(){return (typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();}
const AI_REGISTRY=[
 {id:'demo',kind:'image',name:'Demo (Katalog)',version:'1.0',offline:true,experimental:false,capabilities:['species-identification'],handler:'demoIdentifyLocal'},
 {id:'ondevice',kind:'image',name:'MobileNet',version:'v2.1',offline:true,experimental:false,capabilities:['species-identification'],handler:'ondeviceIdentify'},
 {id:'inat',kind:'cloud',name:'iNaturalist',version:'v1',offline:false,experimental:false,capabilities:['species-identification','plant-identification'],handler:'inatSearch'},
 {id:'plantnet',kind:'image',name:'Pl@ntNet',version:'v2',offline:false,experimental:false,capabilities:['plant-identification'],handler:'plantnetIdentify'},
 {id:'kindwise',kind:'cloud',name:'Kindwise',version:'v1',offline:false,experimental:false,capabilities:['plant-identification','species-identification'],handler:null},
 {id:'birdnet',kind:'audio',name:'BirdNET',version:'endpoint',offline:false,experimental:true,capabilities:['bird-song'],handler:null},
 {id:'gemma',kind:'llm',name:'Gemma',version:'3n',offline:true,experimental:true,capabilities:['explanation'],handler:'gemmaAsk'},
 {id:'habitat',kind:'habitat',name:'Habitat-Regeln',version:'shannon-1.0',offline:true,experimental:false,capabilities:['habitat-scoring'],handler:'score'}
];
function providerById(id){return AI_REGISTRY.find(function(p){return p.id===id;});}
let _aiLast={},_aiLog=[];
function withMetrics(id,fn){
  return async function(){
    const t0=_now();let res=null,warnings=[],err=null;
    try{res=await fn.apply(this,arguments);}catch(e){err=e;warnings.push(e&&e.message?e.message:String(e));}
    const ms=Math.round(_now()-t0);
    const conf=(Array.isArray(res)&&res[0]&&res[0].conf!=null)?res[0].conf:null;
    const meta=providerById(id)||{};
    _aiLast[id]={provider:meta.name||id,id:id,kind:meta.kind||'',version:meta.version||'',offline:!!meta.offline,confidence:conf,durationMs:ms,result:res,warnings:warnings,raw:res,at:Date.now()};
    _aiLog.unshift({id:id,name:meta.name||id,ms:ms,conf:conf,at:Date.now()});if(_aiLog.length>50)_aiLog.pop();
    if(err)throw err;
    return res;
  };
}

  return out;
}

  html+='<button class="btn btn-ghost" style="margin-top:12px" onclick="closeModal()">Schließen</button>';

async function identify(dataUrl,queryText){
  const p=S.provider;
  try{
    if(p==='ondevice'){
      if(!_mnet)toast('On-Device KI wird geladen (beim 1. Mal ~16 MB) …');
      return {provider:'On-Device KI',cands:await withMetrics('ondevice',ondeviceIdentify)(dataUrl)};
    }
    if(p==='gemma'){
      if(!_mnet)toast('Foto-KI wird geladen; Gemma erklärt danach offline …');
      return {provider:'On-Device KI (+Gemma-Erklärung)',cands:await withMetrics('ondevice',ondeviceIdentify)(dataUrl)};
    }
    if(p==='plantnet')return {provider:'Pl@ntNet',cands:await withMetrics('plantnet',plantnetIdentify)(dataUrl)};
    if(p==='inat'&&queryText)return {provider:'iNaturalist',cands:await withMetrics('inat',inatSearch)(queryText)};
  }catch(e){toast('Anbieter nicht erreichbar – nutze Demo. ('+(e.message||e)+')');}
  await new Promise(r=>setTimeout(r,400));
  const d=await withMetrics('demo',demoIdentifyLocal)(dataUrl);
  return {provider:d.local?'Umgebung (Standort)':'Demo',cands:d.cands};
}

/* Enrichment: echter Steckbrief + Funde in der Nähe (iNaturalist) */
async function enrich(sci,lat,lng){
  const out={};
  try{
    const t=await (await fetch('https://api.inaturalist.org/v1/taxa?q='+encodeURIComponent(sci)+'&per_page=1&locale='+(S.lang||'de'))).json();
    const tx=t.results&&t.results[0];
    if(tx){out.photo=tx.default_photo&&tx.default_photo.medium_url;out.summary=(tx.wikipedia_summary||'').replace(/<[^>]+>/g,'');
      out.status=tx.conservation_status&&tx.conservation_status.status_name;out.inatId=tx.id;out.wiki=tx.wikipedia_url;
      if(lat!=null){const o=await (await fetch('https://api.inaturalist.org/v1/observations?taxon_id='+tx.id+'&lat='+lat+'&lng='+lng+'&radius=50&per_page=0')).json();out.nearby=o.total_results;}
    }
  }catch(e){/* offline → ohne Enrichment */}
  return out;
}

/* ── Baustein „Begriffe entschärfen": Kinder-Erklärungen + (i)-Punkte ── */
const GLOSSARY={
  'Natur-Gesundheit':'Zeigt, wie gesund ein Lebensraum ist. Viele verschiedene Arten = meist gesünder. 100 = super, 0 = stark belastet.',
  'Habitat':'Habitat = der Lebensraum, in dem Tiere und Pflanzen wohnen.',
  'Shannon':'Ein Mathe-Wert für Vielfalt: viele Arten UND gleichmäßig verteilt = hoher Wert.',
  'Biodiversität':'Biodiversität = die Vielfalt an Tieren, Pflanzen und Lebensräumen.',
  'Citizen Science':'Bürgerforschung: alle helfen mit, echte Daten für die Wissenschaft zu sammeln.',
  'Bestäuber':'Tiere wie Bienen und Schmetterlinge, die Blüten bestäuben.',
  'GBIF':'Eine große weltweite Datenbank für Naturbeobachtungen.',
  'Monitoring':'Beobachten, wie sich die Natur über die Zeit verändert.'

function infoTip(term){const d=GLOSSARY[term]||term;openModal('<div style="text-align:center"><div class="q-emoji">💡</div><h3>'+esc(term)+'</h3><div class="mini" style="background:var(--s50);border-radius:12px;padding:12px;margin:8px 0 12px;line-height:1.6;text-align:left">'+esc(d)+'</div><button class="btn btn-primary" onclick="closeModal()">Verstanden</button></div>');}

/* „Warum dieser Wert?" – die Natur-Gesundheit aus echten Zahlen erklärt. */
function openScoreWhy(){
  const val=validated();const sp=new Set(val.map(o=>o.speciesKey)).size;const sh=shannon();
  const impactSum=val.reduce((a,o)=>a+(o.scoreImpact||0),0);const s=score();
  openModal('<h3>📊 Warum dieser Wert?</h3>'
    +'<div class="mini muted" style="margin:4px 0 10px">Deine Natur-Gesundheit entsteht so aus deinen geprüften Funden:</div>'
    +'<div style="background:var(--s50);border-radius:12px;padding:12px;line-height:2;font-size:14px">'
      +'Startwert: <b>'+RULES.base+'</b><br>'
      +'+ geprüfte Funde ('+val.length+'): <b>+'+impactSum+'</b><br>'
      +'Verschiedene Arten: <b>'+sp+'</b><br>'

      +'<div style="border-top:1px solid var(--s200);margin:6px 0"></div>'
      +'= Natur-Gesundheit: <b style="color:var(--score)">'+s+'</b> / 100</div>'
    +'<div class="mini muted" style="margin-top:10px">Tipp: Vor allem <b>verschiedene</b> Arten und erledigte <b>Missionen</b> heben den Wert. Zehnmal dieselbe Art zählt weniger als zehn unterschiedliche.</div>'
    +'<button class="btn btn-primary" style="margin-top:12px" onclick="closeModal()">Alles klar</button>');

function ringSvg(val){const r=66,c=2*Math.PI*r,off=c*(1-val/100);
  return '<svg width="170" height="170" viewBox="0 0 170 170"><circle cx="85" cy="85" r="'+r+'" stroke="#e2e8f0" stroke-width="15" fill="none"/><circle cx="85" cy="85" r="'+r+'" stroke="#10b981" stroke-width="15" fill="none" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 85 85)"/></svg>';}
function trendSvg(){const d=trend(),W=300,H=90,pad=8,vals=d.map(x=>x.v),mn=Math.min(...vals)-5,mx=Math.max(...vals)+5,step=(W-pad*2)/(d.length-1);
  const pts=d.map((x,i)=>[pad+i*step,H-pad-(x.v-mn)/(mx-mn||1)*(H-pad*2)]);
  const line=pts.map(p=>p[0].toFixed(0)+','+p[1].toFixed(0)).join(' ');
  const area=pad+','+(H-pad)+' '+line+' '+(W-pad)+','+(H-pad);
  return '<svg width="100%" height="90" viewBox="0 0 '+W+' '+H+'"><polygon points="'+area+'" fill="#d1fae5"/><polyline points="'+line+'" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+pts[pts.length-1][0].toFixed(0)+'" cy="'+pts[pts.length-1][1].toFixed(0)+'" r="4.5" fill="#047857"/></svg>'
    +'<div style="display:flex;justify-content:space-between;padding:2px 6px">'+d.map(x=>'<span class="mini muted">'+x.m+'</span>').join('')+'</div>';}

/* Peer-Review: eine zweite Person (Partner:in, Lehrkraft, anderes Team) bestätigt den Fund.
   Ab 1 unabhängiger Bestätigung wird er „Forschungsqualität" (+1 Score-Bonus, einmalig). */
function peerConfirm(id){
  const o=OBS.find(x=>x.id===id);if(!o)return;
  openModal(`<h3>✔︎ Fund bestätigen</h3>
    <div class="mini muted" style="margin:4px 0 10px">Eine <b>zweite Person</b> (z. B. Partner:in, Lehrkraft oder anderes Team) bestätigt: „${esc(o.speciesDe||o.speciesKey)}" ist richtig bestimmt. Das hebt den Fund auf <b>Forschungsqualität</b> – wie bei iNaturalist.</div>
    <div class="mini" style="background:var(--s50);border-radius:10px;padding:10px;margin-bottom:12px">🛡️ Bitte nur bestätigen, wenn ihr die Art wirklich erkennt. Falsche Bestätigungen schwächen die Datenqualität.</div>
    <button class="btn btn-primary" onclick="doPeerConfirm('${o.id}')">Ja, ich bestätige die Bestimmung</button>
    <button class="btn btn-ghost" style="margin-top:8px" onclick="closeModal()">Abbrechen</button>`);
}
async function doPeerConfirm(id){
  const o=OBS.find(x=>x.id===id);if(!o){closeModal();return;}
  o.confirms=(o.confirms||0)+1;
  if(qualityTier(o)==='research'&&!o._qBonus){o._qBonus=true;o.scoreImpact=(o.scoreImpact||0)+1;}
  try{await IDB.add(o);}catch(e){}
  if(supaOn())supaSync(o);
  closeModal();render();
  toast(qualityTier(o)==='research'?'⭐ Forschungsqualität erreicht – danke fürs Peer-Review!':'Bestätigung gespeichert.');
  if(TAB!=='home')openObsList();
}

/* ===== GEMMA – On-Device Erklär-KI (MediaPipe LLM Inference, WebGPU) =====
   Läuft offline im Browser über WebGPU. Modell (Gemma 3n E2B / passender Web-Build) einmalig laden.
   Nur für kindgerechte Erklärtexte – NICHT für die Arterkennung. Immer mit Fallback auf den Katalog. */
let _gemma=null;const GEMMA_CDN='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-genai@0.10.14';
function gemmaSupported(){return typeof navigator!=='undefined'&&'gpu'in navigator;}
async function gemmaEngine(){
  if(_gemma)return _gemma;
  if(!gemmaSupported())throw new Error('WebGPU wird von diesem Gerät nicht unterstützt');
  if(!S.gemmaUrl)throw new Error('Keine Modell-URL hinterlegt');
  const genai=await import(GEMMA_CDN+'/genai_bundle.mjs').catch(()=>import(GEMMA_CDN+'/+esm'));
  const fileset=await genai.FilesetResolver.forGenAiTasks(GEMMA_CDN+'/wasm');
  _gemma=await genai.LlmInference.createFromOptions(fileset,{baseOptions:{modelAssetPath:S.gemmaUrl},maxTokens:512,topK:40,temperature:0.7,randomSeed:1});
  return _gemma;
}
async function gemmaAsk(prompt){const g=await gemmaEngine();const out=await g.generateResponse(prompt);return(out||'').trim();}
let _lastSp=null;
function gemmaCatalog(sp){const s=SP_BY_KEY[sp.key];return s&&s.fact?s.fact:(sp.de+' – '+sp.sci+'. Beobachte die Art und melde deinen Fund.');}
function gemmaFallback(sp,intro){openModal('<h3>🤖 Erklärung</h3><div class="mini muted">'+esc(intro)+'</div><div class="mini" style="margin-top:12px">'+esc(gemmaCatalog(sp))+'</div><button class="btn btn-ghost" style="margin-top:12px" onclick="closeModal()">Schließen</button>');}
async function gemmaExplain(){
  if(!_lastSp){toast('Zuerst eine Art bestimmen.');return;}
  const sp=_lastSp,age=({'1':'6','2':'7','3':'9','4':'10','5':'11','6':'12','7':'13','8':'14'})[String(S.grade)]||'11';
  const prompt='Du bist eine freundliche Umwelt-Erklärerin für Kinder. Erkläre in 3 kurzen, einfachen deutschen Sätzen (für etwa '+age+'-Jährige): Was ist '+sp.de+' ('+sp.sci+')? Warum ist die Art wichtig für ihren Lebensraum? Und eine konkrete Sache, die ein Kind tun kann, um zu helfen. Keine schwierigen Wörter.';
  if(!gemmaSupported())return gemmaFallback(sp,'Dein Gerät unterstützt kein WebGPU – hier eine Erklärung aus unserem Katalog:');
  if(!S.gemmaUrl)return gemmaFallback(sp,'Es ist noch keine Gemma-Modell-URL hinterlegt (Profil → KI-Quelle) – hier eine Erklärung aus unserem Katalog:');
  openModal('<h3>🤖 Gemma erklärt …</h3><div class="mini muted">Läuft offline auf dem Gerät. Beim ersten Mal dauert das Laden etwas.</div><div id="gemOut" class="mini" style="margin-top:12px">⏳ Denkt nach …</div><button class="btn btn-ghost" style="margin-top:12px" onclick="closeModal()">Schließen</button>');
  try{const txt=await gemmaAsk(prompt);const el=document.getElementById('gemOut');if(el)el.innerHTML=txt?esc(txt):'(keine Antwort)';if(txt&&window.speak)speak(txt);}
  catch(e){const el=document.getElementById('gemOut');if(el)el.innerHTML='⚠️ Gemma nicht verfügbar ('+esc(e.message||(''+e))+').<br><br>'+esc(gemmaCatalog(sp));}
}
function gemmaField(){
  return '<label class="fld">Gemma Modell-URL (.litertlm / .task)</label>'
    +'<input type="text" id="gemUrl" value="'+esc(S.gemmaUrl||'')+'" placeholder="https://…/gemma3n-E2B.litertlm" oninput="onGemmaUrl(this.value)">'
    +'<div class="mini muted" style="margin-top:5px">Läuft offline im Browser über <b>WebGPU</b> (MediaPipe LLM Inference). Empfohlen: <b>Gemma 3n E2B</b> (kleinstes Modell). Einen Web-Build von <b>Gemma 4</b> hier eintragen, sobald verfügbar. Modell wird einmalig geladen (mehrere hundert MB) – nur für Erklärtexte, nicht für den Arten-Scan.</div>'
    +'<button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="gemmaTest()">🤖 Gemma testen</button>'
    +'<div class="mini muted" style="margin-top:5px">WebGPU auf diesem Gerät: '+(gemmaSupported()?'✅ vorhanden':'❌ nicht gefunden')+'</div>';
}
function onGemmaUrl(v){S.gemmaUrl=v.trim();saveSettings();}
async function gemmaTest(){
  if(!gemmaSupported()){toast('WebGPU fehlt – Gemma kann auf diesem Gerät nicht laufen.');return;}
  if(!S.gemmaUrl){toast('Bitte zuerst eine Modell-URL eintragen.');return;}
  openModal('<h3>🤖 Gemma-Test</h3><div id="gemOut" class="mini">⏳ Lädt Modell & denkt nach … (beim 1. Mal langsam)</div><button class="btn btn-ghost" style="margin-top:12px" onclick="closeModal()">Schließen</button>');
  try{const txt=await gemmaAsk('Antworte in einem kurzen, freundlichen deutschen Satz: Warum ist Artenvielfalt wichtig?');const el=document.getElementById('gemOut');if(el)el.innerHTML=txt?esc(txt):'(keine Antwort)';}

let camStream=null,camPhoto=null;
function openCamera(missionId){
  camPhoto=null;
  const monitor=missionId==='__monitor__';
  if(monitor){window._missionId=null;}
  else{window._missionId=missionId||null;window._monitorSpot=null;}
  const label=monitor?'Monitoring-Foto':(missionId?'Beleg-Foto':'Beweisfoto');
  const cam=$('cam');cam.classList.remove('hidden');
  cam.innerHTML=`<div class="top"><b style="color:#fff">${label}</b><button class="cbtn" onclick="cancelCamera()">✕</button></div>
    <div class="view"><video id="vid" playsinline muted></video><div class="corners"><i style="top:16px;left:16px;border-right:0;border-bottom:0;border-radius:8px 0 0 0"></i><i style="top:16px;right:16px;border-left:0;border-bottom:0;border-radius:0 8px 0 0"></i><i style="bottom:16px;left:16px;border-right:0;border-top:0;border-radius:0 0 0 8px"></i><i style="bottom:16px;right:16px;border-left:0;border-top:0;border-radius:0 0 8px 0"></i></div></div>
    <div class="controls"><button class="cbtn" onclick="pickFile()" title="Foto hochladen">🖼️</button><button class="shutter" id="shot" onclick="shoot()">📷</button><button class="cbtn" onclick="startCam()" title="Neu">🔄</button></div>
    <input id="fileIn" type="file" accept="image/*" capture="environment" style="display:none" onchange="onFile(event)">`;
  startCam();
}
async function startCam(){
  try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280}},audio:false});
    const v=$('vid');if(v){v.srcObject=camStream;await v.play().catch(()=>{});}}
  catch(e){toast('Kamera nicht verfügbar – nutze „Hochladen".');pickFile();}
}
function stopCam(){if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}}
function pickFile(){$('fileIn')&&$('fileIn').click();}
async function onFile(ev){const f=ev.target.files&&ev.target.files[0];if(!f)return;window._photoSource='upload';try{window._exif=await readExif(f);}catch(e){window._exif={hasExif:false};}camPhoto=await fileToDataUrl(f);stopCam();afterPhoto();}
function shoot(){const v=$('vid');if(!v||!v.videoWidth){toast('Kamera noch nicht bereit …');return;}camPhoto=compress(v);window._photoSource='camera';window._exif=null;stopCam();afterPhoto();}
function closeCamera(){stopCam();$('cam').classList.add('hidden');}
function cancelCamera(){window._monitorSpot=null;window._missionId=null;window._isAudio=false;closeCamera();}

async function afterPhoto(){
  closeCamera();
  window._isAudio=false;
  // Foto analysieren (Schärfe + Grün-Index).
  window._analysis=await analyzePhoto(camPhoto);
  if(window._monitorSpot){return saveMonitorShot();}
  if(window._missionId){return saveMissionProof(window._missionId);}
  // Foto-Coach: bei unscharfem Foto einen Tipp geben und Neuaufnahme anbieten.
  if(window._analysis&&window._analysis.blurry){return photoCoach();}
  continueScan();
}

function askAiThenScan(){

/* Vertrauensscore der KI (0–1) → Label + Farbe. */
function confLabel(v){return v>=0.75?['hohes Vertrauen','var(--em)']:v>=0.5?['mittleres Vertrauen','#f59e0b']:['niedriges Vertrauen','#f43f5e'];}
/* Beobachtungsqualität A/B/C aus Foto-Schärfe, Standort, Zeit/Saison und Echtheit (EXIF/Kamera). */
function qualityGrade(rec){
  const a=window._analysis||{};
  const crit=[
    {ok:a.blurry!==true&&(a.sharp==null||a.sharp>=70),label:'Foto scharf'},
    {ok:rec.lat!=null&&(rec.acc==null||rec.acc<=(RULES.gpsMaxAcc||60)),label:'Standort genau'},
    {ok:!rec.checks.some(x=>x.lvl==='warn'&&/(älter|untypisch)/i.test(x.t)),label:'Zeit & Saison plausibel'},
    {ok:rec.photoSource==='camera'||(rec.exif&&rec.exif.hasExif),label:'Echtes Kamerafoto (EXIF)'}
  ];
  const n=crit.filter(c=>c.ok).length;
  return {grade:n>=4?'A':n>=2?'B':'C',n:n,crit:crit};
}
function _confBlock(c){
  if(c.conf==null)return '<div class="mini muted" style="margin-bottom:10px">ℹ️ Diese Quelle liefert keinen KI-Vertrauenswert – bitte die Art selbst prüfen.</div>';
  const p=Math.round(c.conf*100),l=confLabel(c.conf);
  return '<div class="mini" style="margin-bottom:10px"><div class="row" style="justify-content:space-between;margin-bottom:4px"><span><b>KI-Vertrauen</b></span><span style="color:'+l[1]+';font-weight:800">'+p+'% · '+l[0]+'</span></div><div style="height:7px;background:var(--s100);border-radius:6px;overflow:hidden"><div style="height:100%;width:'+p+'%;background:'+l[1]+'"></div></div><div class="mini muted" style="margin-top:4px">Warum? Plausibilität unten (Standort, Saison, Beweisfoto). Du entscheidest.</div></div>';

/* ============================ QUIZ / LERNEN ============================ */
function pick(arr,n){const c=arr.slice();for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return n?c.slice(0,n):c;}
/* Spaced Repetition: früher falsch beantwortete Arten häufiger abfragen.
   `exclude` = Arten, die in dieser Quiz-Runde schon dran waren → keine Wiederholung. */
function pickQuizSpecies(exclude){
  exclude=exclude||[];
  let pool=quizPool().filter(x=>exclude.indexOf(x.key)<0);
  if(!pool.length)pool=quizPool(); // Notfall: Katalog kleiner als Fragenzahl → wieder alle zulassen
  const wrong=(S.wrongPool||[]).map(k=>pool.find(x=>x.key===k)).filter(Boolean);
  if(wrong.length&&Math.random()<0.45)return pick(wrong,1)[0];
  return pick(pool,1)[0];
}
function makeQuestion(mode,exclude){
  const n=gradeOpts()-1; // Anzahl Distraktoren je nach Altersstufe (2 oder 3)
  const s=pickQuizSpecies(exclude);let q,correct,opts;
  if(mode==='habitat'){q='In welchem Lebensraum findest du '+s.de+'?';correct=s.biome;
    opts=pick([...new Set(SPECIES.map(x=>x.biome))].filter(b=>b!==correct),n).concat(correct);}
  else if(mode==='where'){q='Wo kommt '+s.de+' hauptsächlich vor?';correct=s.cont;
    opts=pick([...new Set(SPECIES.map(x=>x.cont))].filter(b=>b!==correct),n).concat(correct);}
  else if(mode==='status'){q='Wie ist der Status von '+s.de+'?';correct=s.rar;
    opts=pick([...new Set(SPECIES.map(x=>x.rar))].filter(b=>b!==correct),n).concat(correct);}
  else if(mode==='group'){q='Zu welcher Gruppe gehört '+s.de+'?';correct=s.grp;
    opts=pick([...new Set(SPECIES.map(x=>x.grp))].filter(b=>b!==correct),n).concat(correct);}
  else{q='Welche Art siehst du?';correct=s.de;opts=pick(quizPool().filter(x=>x.key!==s.key),n).map(x=>x.de).concat(correct);}
  return {emoji:s.emoji,sci:s.sci,q,opts:pick(opts),correct,fact:s.fact,mode,key:s.key};
}

/* Vorlesen für das Quiz: Frage + Antwortmöglichkeiten bzw. die Auflösung. */
function speakQuestion(){if(!QZ||!QZ.cur)return;speak(QZ.cur.q+'. Antwortmöglichkeiten: '+QZ.cur.opts.join(', ')+'.');}
function speakAnswer(){if(!QZ||!QZ.cur)return;speak('Die richtige Antwort ist: '+QZ.cur.correct+'. '+(QZ.cur.fact||''));}
/* Teilbares Emoji-Ergebnis (GeoQuest-Idee, datenschutzfreundlich – keine Konten/Namen). */
function shareDaily(){
  const marks=(QZ.marks||[]).map(m=>m?'🟩':'⬜').join('');
  const txt='BIOGLOW 🌿 Tägliche Challenge '+QZ.right+'/'+QZ.n+' '+marks+' · Streak 🔥'+S.streak;
  if(navigator.share)navigator.share({text:txt}).catch(()=>{});
  else if(navigator.clipboard){navigator.clipboard.writeText(txt);toast('Ergebnis kopiert!');}
  else toast(txt);
}
function nextQ(){
  if(QZ.i>=QZ.n)return endQuiz();
  const m=QZ.mode==='mix'?pick(['habitat','where','status','name','group'],1)[0]:QZ.mode;
  QZ.used=QZ.used||[];
  QZ.cur=makeQuestion(m,QZ.used);
  if(QZ.cur&&QZ.cur.key)QZ.used.push(QZ.cur.key); // in dieser Runde nicht noch einmal
  openModal(`<div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="mini" style="font-weight:800;color:var(--em-d)">${QZ.daily?'Tägliche Challenge':'Quiz'} · ${QZ.i+1}/${QZ.n}</span><span class="row" style="gap:8px;align-items:center"><span class="mini muted">✓ ${QZ.right}</span><button class="btn btn-ghost btn-sm" style="width:auto;padding:2px 10px" onclick="closeModal()" title="Quiz beenden">✕</button></span></div>
    <div class="q-emoji" id="qImg">${QZ.cur.emoji}</div><h3 style="text-align:center;margin-bottom:6px">${esc(QZ.cur.q)}</h3>
    <div style="text-align:center;margin-bottom:12px"><button class="btn btn-ghost btn-sm" style="width:auto" onclick="speakQuestion()">🔊 Frage &amp; Antworten vorlesen</button></div>
    <div id="qOpts">${QZ.cur.opts.map(o=>`<button class="q-opt" onclick="answer(this,'${esc(o).replace(/'/g,"\\'")}')">${esc(o)}</button>`).join('')}</div>`);
  loadQuizPhoto(QZ.cur.sci);
}
/* Lädt online ein echtes Foto der Art (iNaturalist/Wikipedia) und ersetzt das Emoji im Quiz. */
function loadQuizPhoto(sci){
  if(!sci||!online())return;
  speciesPhoto(sci).then(u=>{const el=document.getElementById('qImg');if(u&&el)el.innerHTML='<img src="'+u+'" alt="" style="width:132px;height:132px;object-fit:cover;border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,.12)">';}).catch(()=>{});
}
function answer(btn,val){
  const correct=QZ.cur.correct;
  document.querySelectorAll('#qOpts .q-opt').forEach(b=>{b.onclick=null;
    if(b.textContent===correct)b.classList.add('correct');else if(b===btn)b.classList.add('wrong');});
  if(val===correct)QZ.right++;
  (QZ.marks=QZ.marks||[]).push(val===correct);
  if(QZ.cur.key){S.wrongPool=S.wrongPool||[];
    if(val===correct)S.wrongPool=S.wrongPool.filter(k=>k!==QZ.cur.key);
    else if(S.wrongPool.indexOf(QZ.cur.key)<0){S.wrongPool.push(QZ.cur.key);if(S.wrongPool.length>30)S.wrongPool.shift();}
    saveSettings();}
  const box=document.createElement('div');box.innerHTML=`<div class="mini" style="background:var(--s50);border-radius:12px;padding:10px;margin-top:10px">${val===correct?'✅ Richtig! ':'❌ '}${esc(QZ.cur.fact)}</div><button class="btn btn-ghost btn-sm" style="width:auto;margin-top:8px" onclick="speakAnswer()">🔊 Auflösung vorlesen</button><button class="btn btn-primary" style="margin-top:10px" onclick="QZ.i++;nextQ()">${QZ.i+1>=QZ.n?'Ergebnis':'Weiter'}</button>`;
  $('qOpts').after(box);
}
function endQuiz(){
  const perfect=QZ.right===QZ.n;
  if(QZ.daily){const t=todayStr();if(S.lastDaily!==t){S.lastDaily=t;S.streak=(S.streak||0)+1;}S.dailyBest=Math.max(S.dailyBest||0,QZ.right);saveSettings();}
  openModal(`<div style="text-align:center;padding:10px 0"><div style="font-size:56px">${perfect?'🏆':QZ.right>=3?'🎉':'🌱'}</div>
    <h2 style="margin:8px 0">${QZ.right} / ${QZ.n} richtig</h2>
    <div class="muted mini">${QZ.daily?'Streak 🔥 '+S.streak+' · bester Tag: '+S.dailyBest:'Gut gemacht! Übung macht die Meisterin.'}</div>
    ${QZ.daily?`<div class="mini" style="letter-spacing:2px;margin-top:10px">${(QZ.marks||[]).map(m=>m?'🟩':'⬜').join('')}</div><button class="btn btn-ghost" style="margin-top:12px" onclick="shareDaily()">📤 Ergebnis teilen</button>`:''}
    <button class="btn btn-primary" style="margin-top:10px" onclick="closeModal();go('learn')">Fertig</button></div>`);
}

function fuzz(o){if((o.sensitive||S.fuzzAll)&&o.lat!=null)return{lat:Math.round(o.lat/0.05)*0.05,lng:Math.round(o.lng/0.05)*0.05,gen:true};return{lat:o.lat,lng:o.lng,gen:false};}
function exportDwc(){
  const val=validated();if(!val.length){toast('Noch keine geprüfte Beobachtung zum Export.');return;}
  const recs=val.map(o=>{const c=fuzz(o);return{occurrenceID:o.id,scientificName:o.speciesSci||o.speciesKey,vernacularName:o.speciesDe,
    eventDate:o.observedAt,decimalLatitude:c.lat,decimalLongitude:c.lng,coordinateUncertaintyInMeters:o.acc,
    basisOfRecord:'HumanObservation',informationWithheld:c.gen?'coordinates generalized (sensitive species)':null,
    identificationVerificationStatus:o.status};});
  const blob=new Blob([JSON.stringify({catalog:'BIOGLOW',schema:'dwc-json/1.0',exportedAt:new Date().toISOString(),count:recs.length,records:recs},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bioglow-katalog-'+todayStr()+'.json';a.click();
  toast(recs.length+' Beobachtungen exportiert.');
}
/* CSV-Export (Excel-tauglich) – Idee aus dem Balance-Flow-Projekt (Disc). */
function exportCsv(){
  const rows=OBS.filter(o=>o.source==='scan');
  if(!rows.length){toast('Noch keine Beobachtung zum Export.');return;}
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const head=['id','datum','art_de','art_wissenschaftlich','gruppe','status','lat','lng','score','xp'];
  const lines=[head.join(';')];
  rows.forEach(o=>{const c=fuzz(o);lines.push([o.id,o.createdAt,o.speciesDe,o.speciesSci||'',o.grp||'',o.status,c.lat,c.lng,o.scoreImpact||0,o.xp||0].map(q).join(';'));});
  const blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bioglow-funde-'+todayStr()+'.csv';a.click();
  toast('CSV exportiert ('+rows.length+' Funde, Excel-tauglich).');
}

/* ============================ UMWELTDATEN: Open-Meteo (ohne Schlüssel) ============================ */
async function fetchEnv(lat,lng){
  if(lat==null)return null;
  try{
    const u='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lng+'&current=temperature_2m,relative_humidity_2m,precipitation,soil_moisture_0_to_1cm&timezone=auto';
    const j=await (await fetch(u)).json();const c=j.current||{};
    return {temp:c.temperature_2m,hum:c.relative_humidity_2m,rain:c.precipitation,soil:c.soil_moisture_0_to_1cm};
  }catch(e){return null;}
}
/* Luftqualität über die Open-Meteo Air-Quality-API (kostenlos, ohne Schlüssel, gleicher Anbieter). */
async function fetchAir(lat,lng){
  if(lat==null)return null;
  try{
    const u='https://air-quality-api.open-meteo.com/v1/air-quality?latitude='+lat+'&longitude='+lng+'&current=pm2_5,pm10,european_aqi&timezone=auto';
    const j=await (await fetch(u)).json();const c=j.current||{};
    return {pm25:c.pm2_5,pm10:c.pm10,aqi:c.european_aqi};
  }catch(e){return null;}
}
function aqiLabel(a){if(a==null)return '—';return a<=20?'sehr gut':a<=40?'gut':a<=60?'mäßig':a<=80?'schlecht':a<=100?'sehr schlecht':'extrem schlecht';}

const ACTIONS={
  Insekt:'Lass eine wilde Ecke stehen und pflanze heimische Blühpflanzen – Nahrung für Bestäuber.',
  Pflanze:'Erst nach der Blüte mähen – so reifen Samen und Insekten finden Nahrung.',

};
function recommend(sp,env){
  let base=ACTIONS[sp&&sp.grp]||'Dokumentiere weiter Veränderungen – jede Meldung hilft der Forschung.';
  if(sp&&sp.sensitive)base='Diese Art ist gefährdet! Melde den Fund der Naturschutzbehörde und schütze den Standort.';
  let eco='';
  if(env&&env.soil!=null&&env.soil<0.12)eco=' 🌡️ Boden sehr trocken – gieße neue Pflanzungen und schaffe Schatten.';
  else if(env&&env.temp!=null&&env.temp>28)eco=' 🌡️ Sehr warm – flache Wasserschalen helfen Insekten und Vögeln.';

}

/* ============================ ECO-SIM (Modell 3: Simulation) ============================ */
const BIOME_ENV={Wiese:{t:18,m:0.25},Teich:{t:16,m:0.9},Trockenrasen:{t:22,m:0.12},Offenland:{t:17,m:0.3},Garten:{t:18,m:0.35},Siedlung:{t:19,m:0.2}};
/* Klimahüllen-Modell: vergleicht das (verschobene) lokale Klima mit dem Optimum einer Art. */
function suitabilityP(p,dTemp,dRain){
  const base=window._ecoBase||{t:18,m:0.3};
  const envT=base.t+dTemp,envM=Math.max(0,base.m*(1+dRain/100));
  const tScore=1-Math.min(1,Math.abs(envT-p.t)/(p.wt||8));
  const mScore=1-Math.min(1,Math.abs(envM-p.m)/(p.m||0.3));
  return Math.max(0,Math.round((tScore*0.6+mScore*0.4)*100));
}
function seed01(s){let h=2166136261;for(let i=0;i<String(s).length;i++){h^=String(s).charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0)/2**32;}
/* Aus einer lokalen Art + aktuellem Klima eine „Klimahülle" (Optimum) ableiten. */
function ecoPref(name,base){const r=seed01(name);return {t:base.t+(r*3-1.5),m:Math.max(0.05,base.m*(0.7+seed01(name+'m')*0.7)),wt:6+seed01(name+'w')*3};}
/* Altersgerechte Konfiguration der Öko-Simulation. */
function ecoGradeCfg(){const g=S.grade||'3';
  if(g==='1'||g==='2')return {n:4,simple:true,intro:'Schieb die Regler! Was passiert mit den Tieren und Pflanzen, wenn es <b>wärmer</b> oder <b>trockener</b> wird?'};
  if(g==='4'||g==='5')return {n:8,simple:false,intro:'Verschiebe Temperatur &amp; Niederschlag und beobachte die <b>Habitat-Eignung</b> der lokal häufigsten Arten (vereinfachtes Klimahüllen-Modell).'};
  return {n:6,simple:false,intro:'Verschiebe Temperatur &amp; Niederschlag und sieh, wie gut Arten deinen Lebensraum noch finden. So wird der Klimawandel lokal begreifbar.'};
}
/* Die lokal häufigsten Arten (ALLE Gruppen: Pflanzen, Gräser, Bäume, Insekten, Vögel …) von iNaturalist. */
async function fetchNearbySpecies(lat,lng,n){
  const u='https://api.inaturalist.org/v1/observations/species_counts?lat='+lat+'&lng='+lng+'&radius=30&per_page='+(n+6)+'&locale='+(S.lang||'de')+'&hrank=species&verifiable=true';
  const j=await (await fetch(u)).json();
  return (j.results||[]).map(r=>{const t=r.taxon||{};return {de:t.preferred_common_name||t.name,sci:t.name,emoji:emojiForIconic(t.iconic_taxon_name)};}).filter(x=>x.de);
}
async function openEcoSim(){
  const cfg=ecoGradeCfg();window._sim={dt:0,dr:0};window._ecoCfg=cfg;
  openModal('<h3>🌍 Öko-Simulation</h3><div class="mini muted" style="margin:4px 0 12px">'+cfg.intro+'</div>'
    +'<label class="fld">Temperatur: <span id="simT">+0.0 °C</span></label><input type="range" min="-2" max="6" step="0.5" value="0" style="width:100%" oninput="window._sim.dt=+this.value;runEcoSim()">'
    +'<label class="fld">Niederschlag: <span id="simR">+0 %</span></label><input type="range" min="-60" max="60" step="10" value="0" style="width:100%" oninput="window._sim.dr=+this.value;runEcoSim()">'
    +'<div id="simRes" style="margin-top:14px"><div class="spinner"></div><div class="mini muted">Suche Arten in deiner Umgebung …</div></div>'
    +'<button class="btn btn-primary" style="margin-top:12px" onclick="closeModal()">Schließen</button>');
  let base={t:18,m:0.3},src='',sp=null;
  if(S.useGps&&online()){
    try{
      const pos=await getPosition();
      const env=await fetchEnv(pos.lat,pos.lng);
      if(env&&env.temp!=null)base={t:clamp(env.temp,6,26),m:env.soil!=null?Math.max(0.05,env.soil):0.3};
      const near=await fetchNearbySpecies(pos.lat,pos.lng,cfg.n);
      if(near&&near.length){sp=near.slice(0,cfg.n).map(s=>({de:s.de,emoji:s.emoji,pref:ecoPref(s.sci||s.de,base)}));src='📍 Häufigste Arten in deiner Umgebung (iNaturalist, live)';}
    }catch(e){}
  }
  if(!sp){
    const scanned=[...new Set(OBS.filter(o=>o.source==='scan').map(o=>o.speciesKey))].map(k=>SP_BY_KEY[k]).filter(Boolean);
    const list=(scanned.length?scanned:SPECIES).slice(0,cfg.n);
    sp=list.map(s=>{const b=BIOME_ENV[s.biome]||{t:18,m:0.3};return {de:s.de,emoji:s.emoji,pref:{t:b.t,m:b.m,wt:8}};});
    base={t:18,m:0.3};
    src=online()?(S.useGps?'🌿 Beispiel-Arten (Umgebung nicht ermittelbar)':'🌿 Beispiel-Arten (Standort in den Einstellungen aus)'):'📴 Offline – Beispiel-Arten aus dem Katalog';
  }
  window._ecoBase=base;window._ecoSpecies=sp;window._ecoSource=src;
  runEcoSim();
}
function runEcoSim(){
  if(!window._ecoSpecies||!$('simRes'))return;
  const dt=window._sim.dt,dr=window._sim.dr,cfg=window._ecoCfg||{simple:false};
  $('simT').textContent=(dt>=0?'+':'')+dt.toFixed(1)+' °C';$('simR').textContent=(dr>=0?'+':'')+dr+' %';
  const note=cfg.simple?(dt>1.5?'Uff! Wenn es viel wärmer wird, haben es manche Tiere und Pflanzen schwer.':'Schieb den Temperatur-Regler nach rechts – was passiert dann?')
    :(dt>1.5?'⚠️ Bei +'+dt.toFixed(1)+' °C geraten wärme-/feuchteempfindliche Arten unter Druck – Lebensräume verschieben sich.':'Tipp: Schon +1,5 °C können ganze Lebensräume verschieben. Probiere es aus!');
  $('simRes').innerHTML=(window._ecoSource?'<div class="mini muted" style="margin-bottom:8px">'+esc(window._ecoSource)+'</div>':'')
    +window._ecoSpecies.map(sp=>{const s=suitabilityP(sp.pref,dt,dr),col=s>=66?'#10b981':s>=40?'#f59e0b':'#f43f5e';const tag=cfg.simple?(s>=66?' 🙂':s>=40?' 😐':' 😟'):'';
      return '<div style="margin-bottom:9px"><div class="row" style="justify-content:space-between"><span class="mini"><b>'+sp.emoji+' '+esc(sp.de)+'</b></span><span class="mini" style="color:'+col+';font-weight:800">'+s+'%'+tag+'</span></div><div style="height:7px;background:var(--s100);border-radius:6px;overflow:hidden"><div style="height:100%;width:'+s+'%;background:'+col+'"></div></div></div>';}).join('')
    +'<div class="mini muted" style="margin-top:8px">'+note+'</div>';
}

/* ============================ GBIF: echte weltweite Verbreitung (ohne Schlüssel) ============================ */
async function gbifInfo(sci,lat,lng){
  try{
    const m=await (await fetch('https://api.gbif.org/v1/species/match?name='+encodeURIComponent(sci))).json();
    if(!m||!m.usageKey)return null;
    let near=null;
    if(lat!=null){
      const u='https://api.gbif.org/v1/occurrence/search?taxonKey='+m.usageKey+'&decimalLatitude='+(lat-0.25).toFixed(3)+','+(lat+0.25).toFixed(3)+'&decimalLongitude='+(lng-0.25).toFixed(3)+','+(lng+0.25).toFixed(3)+'&limit=0';
      const o=await (await fetch(u)).json();near=o.count;
    }
    const t=await (await fetch('https://api.gbif.org/v1/occurrence/search?taxonKey='+m.usageKey+'&limit=0')).json();

}

/* ============================ Foto-Analyse: Schärfe (Blur) + Grün-Index (Mini-NDVI) ============================ */
function analyzePhoto(dataUrl){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const w=64,h=64,c=document.createElement('canvas');c.width=w;c.height=h;
      const ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);
      const d=ctx.getImageData(0,0,w,h).data;
      let g=0,rb=0;for(let i=0;i<d.length;i+=4){g+=d[i+1];rb+=(d[i]+d[i+2])/2;}
      const green=Math.round(clamp((g-rb)/(g+rb+1)+0.5,0,1)*100);
      const gray=[];let gsum=0;for(let i=0;i<d.length;i+=4){const gl=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];gray.push(gl);gsum+=gl;}
      const bright=Math.round(gsum/gray.length/255*100);
      let sum=0,sum2=0,n=0;
      for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x;const lap=4*gray[i]-gray[i-1]-gray[i+1]-gray[i-w]-gray[i+w];sum+=lap;sum2+=lap*lap;n++;}
      const varr=sum2/n-Math.pow(sum/n,2);
      res({green:green,bright:bright,sharp:Math.round(varr),blurry:varr<70});
    };
    img.onerror=()=>res({green:null,sharp:null,blurry:false});
    img.src=dataUrl;
  });
}

/* ============================ Audio-Aufnahme (Vogelstimme) ============================ */
let mediaRec=null,audioChunks=[];
function recordAudio(seconds){
  seconds=seconds||6;
  return new Promise(async(res,rej)=>{
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mediaRec=new MediaRecorder(stream);audioChunks=[];
      mediaRec.ondataavailable=e=>audioChunks.push(e.data);
      mediaRec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());
        const blob=new Blob(audioChunks,{type:'audio/webm'});const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(blob);};
      mediaRec.start();setTimeout(()=>{try{mediaRec.state!=='inactive'&&mediaRec.stop();}catch(e){}},seconds*1000);
    }catch(e){rej(new Error('Mikrofon nicht verfügbar'));}
  });
}

        +'<b class="mini muted">Neueste Funde</b>'

/* Klassen-/Gruppen-Dashboard: liest Funde aus der Cloud und baut eine Bestenliste. */
async function openClassDashboard(){
  if(!supaOn())return toast('Bitte zuerst die Cloud einrichten (URL + Schlüssel).');
  openModal('<div style="text-align:center"><div class="spinner"></div><div class="mini muted">Lade Klassendaten …</div></div>');
  try{
    const c=supaCfg();
    let url=c.url.replace(/\/$/,'')+'/rest/v1/observations?select=observer,species_name,score_impact,status,class_code&order=created_at.desc&limit=2000';
    if(S.classCode)url+='&class_code=eq.'+encodeURIComponent(S.classCode);
    const r=await fetch(url,{headers:{apikey:c.key,Authorization:'Bearer '+c.key}});
    const rows=await r.json();
    if(!Array.isArray(rows))throw new Error(rows&&rows.message?rows.message:'Antwort ungültig');
    const byUser={};rows.forEach(o=>{const u=o.observer||'—';if(!byUser[u])byUser[u]={finds:0,score:0};byUser[u].finds++;if(o.status==='validated')byUser[u].score+=(o.score_impact||0);});
    const board=Object.keys(byUser).map(u=>Object.assign({u:u},byUser[u])).sort((a,b)=>b.score-a.score||b.finds-a.finds);
    const species=new Set(rows.map(o=>o.species_name)).size;
    openModal('<h3>🎓 Klassen-Dashboard</h3><div class="mini muted" style="margin:4px 0 10px">'+(S.classCode?('Klasse „'+esc(S.classCode)+'"'):'Alle Funde')+' · '+rows.length+' Funde · '+species+' Arten</div>'
      +'<div class="card"><b style="font-size:13px">🏆 Bestenliste</b>'+(board.length?board.slice(0,15).map((b,i)=>'<div class="row" style="justify-content:space-between;padding:7px 0;border-top:1px solid var(--s100)"><span class="mini"><b>'+(i+1)+'. '+esc(b.u)+'</b></span><span class="mini muted">'+b.finds+' Funde · +'+b.score+' Score</span></div>').join(''):'<div class="mini muted">Noch keine Daten.</div>')+'</div>'
      +'<button class="btn btn-primary" style="margin-top:10px" onclick="closeModal()">Schließen</button>');
  }catch(e){
    openModal('<h3>🎓 Klassen-Dashboard</h3><div class="mini muted" style="margin:8px 0">Konnte nicht laden: '+esc(e.message||'Fehler')+'.<br><br>Prüfe die Cloud-Einrichtung und ob die Spalten <b>observer</b> und <b>class_code</b> in Supabase existieren (siehe aktualisierte <b>SUPABASE_setup.sql</b>).</div><button class="btn btn-ghost" onclick="closeModal()">Schließen</button>');
  }
}

/* Habitat-Tagebuch: automatische Wochen-Zusammenfassung (Motivation + Mitteilen-Kriterium). */
function openDiary(){
  const weekAgo=Date.now()-7*864e5;
  const wk=OBS.filter(o=>new Date(o.createdAt).getTime()>=weekAgo);
  const scans=wk.filter(o=>o.source==='scan');
  const miss=wk.filter(o=>o.source==='mission');
  const spec=new Set(scans.map(o=>o.speciesKey)).size;
  const research=wk.filter(o=>qualityTier(o)==='research').length;
  const meas=wk.filter(o=>o.status==='measure'||o.status==='monitor').length;
  const scoreGain=wk.reduce((a,o)=>a+(o.status==='validated'?(o.scoreImpact||0):0),0);
  const groups={};scans.forEach(o=>{const g=o.grp||'Art';groups[g]=(groups[g]||0)+1;});
  const topGrp=Object.keys(groups).sort((a,b)=>groups[b]-groups[a])[0];
  const summary=wk.length
    ? 'Deine Woche mit BIOGLOW: '+scans.length+' Funde, '+spec+' Arten'+(miss.length?', '+miss.length+' Missionen':'')+(scoreGain?', plus '+scoreGain+' Punkte für den Habitat-Score':'')+'.'+(topGrp?' Am häufigsten: '+tr(topGrp)+'.':'')
    : 'Diese Woche war noch nichts los. Zeit für deinen ersten Fund – tippe auf Scannen!';
  const stat=(v,l)=>'<div class="stat"><div class="v">'+v+'</div><div class="l">'+l+'</div></div>';
  openModal('<div class="row" style="justify-content:space-between;margin-bottom:6px"><h3>📔 Habitat-Tagebuch</h3><button class="btn btn-ghost btn-sm" style="width:auto" onclick="speak('+JSON.stringify(summary)+')">🔊 Vorlesen</button></div>'
    +'<div class="mini muted" style="margin-bottom:10px">Deine letzten 7 Tage</div>'
    +'<div class="stat-row" style="margin-bottom:12px">'+stat(scans.length,'Funde')+stat(spec,'Arten')+stat(miss.length,'Missionen')+'</div>'
    +(research?'<div class="mini" style="margin-bottom:8px"><span class="chip chip-em">⭐ '+research+' in Forschungsqualität</span></div>':'')
    +(meas?'<div class="mini" style="margin-bottom:8px">🔬 '+meas+' Sensor-/Monitoring-Messungen</div>':'')
    +(scoreGain?'<div class="mini" style="margin-bottom:8px">📈 Habitat-Score: <b>+'+scoreGain+'</b> Punkte diese Woche</div>':'')
    +(topGrp?'<div class="mini" style="margin-bottom:10px">🏆 Meiste Funde: <b>'+esc(tr(topGrp))+'</b></div>':'')
    +'<div class="mini" style="background:var(--em-tint);border:1px solid var(--em-soft);border-radius:12px;padding:10px;margin-bottom:12px;color:var(--em-deep)">'+esc(summary)+'</div>'
    +(navigator.share?'<button class="btn btn-ghost" onclick="navigator.share({text:'+JSON.stringify(summary)+'}).catch(()=>{})">🔗 Woche teilen</button>':'<button class="btn btn-ghost" onclick="copyText('+JSON.stringify(summary)+')">📋 Woche kopieren</button>')
    +'<button class="btn btn-ghost" style="margin-top:8px" onclick="closeModal()">Schließen</button>');
}
